<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>温泉運搬記録（うちまち）</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#2b2b2b;--sub:#777;--line:#e2dccf;--main:#1f7a8c;--main2:#e3f2f5;--ok:#2e7d32;--warn:#c62828;--warn2:#fdecea;--amber:#b26a00}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:16px;padding-bottom:84px}
header{background:var(--main);color:#fff;padding:14px 16px 10px;padding-top:max(14px,env(safe-area-inset-top))}
header h1{margin:0;font-size:20px}
header .sub{font-size:13px;opacity:.9;margin-top:2px}
#weekBox{margin:12px 16px 0;padding:12px 14px;border-radius:12px;font-weight:600}
#weekBox.ok{background:#e8f5e9;color:var(--ok)}
#weekBox.ng{background:var(--warn2);color:var(--warn)}
nav{display:flex;gap:6px;margin:12px 16px 0;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0}
nav button{flex:1;padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:15px;color:var(--ink)}
nav button.on{background:var(--main);color:#fff;border-color:var(--main)}
section{display:none;margin:12px 16px}
section.on{display:block}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label.t{display:block;font-size:13px;color:var(--sub);margin:12px 0 5px}
label.t:first-child{margin-top:0}
input,select,textarea{font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;width:100%;background:#fff;color:var(--ink);font-family:inherit}
textarea{min-height:70px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;font-size:15px;color:var(--ink)}
.chip.on{background:var(--main);color:#fff;border-color:var(--main)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 0;border:0;background:#fff;font-size:15px;color:var(--ink)}
.seg button.on{background:var(--main);color:#fff}
.checks label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.checks label:last-child{border-bottom:0}
.checks input{width:22px;height:22px;flex:none}
.btn{display:inline-block;padding:12px 16px;border:0;border-radius:11px;background:var(--main);color:#fff;font-size:16px;font-weight:600}
.btn.wide{width:100%;margin-top:14px;padding:15px}
.btn.gray{background:#e9e5dc;color:var(--ink)}
.btn.red{background:var(--warn)}
.btn.sm{padding:7px 11px;font-size:14px;font-weight:500}
.photoBox img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.rec{border-left:5px solid var(--main)}
.rec.rest{border-left-color:#aaa}
.rec.miss{border-left-color:var(--warn);background:var(--warn2)}
.rec h3{margin:0 0 4px;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.rec .meta{font-size:14px;color:var(--sub);line-height:1.6}
.rec .acts{display:flex;gap:8px;margin-top:8px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--main2);color:var(--main);margin-left:4px;font-weight:500}
.tag.g{background:#eee;color:#666}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--main2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--main)}
.stat span{font-size:12px;color:var(--sub)}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:15px}
.bar .n{width:64px}
.bar .b{flex:1;height:18px;background:#eee;border-radius:9px;overflow:hidden}
.bar .b i{display:block;height:100%;background:var(--main)}
.bar .c{width:42px;text-align:right}
.muted{color:var(--sub);font-size:13px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90%}
#toast.on{opacity:.95}
#syncDot{font-size:12px;opacity:.85}
table.book{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.book th,table.book td{border:1px solid #999;padding:5px 4px;text-align:center}
table.book th{background:#eef5f6}
table.book td.l{text-align:left}
#printArea{display:none}
@media print{
  body{background:#fff;padding:0}
  header,nav,section,#weekBox,#toast{display:none!important}
  #printArea{display:block!important;padding:10mm}
  #printArea h2{font-size:18px;margin:0 0 4px}
  @page{size:A4 landscape;margin:8mm}
}
/* 理事長マスコット */
#mascot{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;width:54px;height:54px;cursor:pointer;-webkit-tap-highlight-color:transparent}
#mascot .face{width:54px;height:54px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);background:center/cover;animation:bob 2.6s ease-in-out infinite}
#mascot.jump .face{animation:jump .6s ease}
#mascot .say{position:absolute;right:62px;bottom:10px;background:#fff;color:var(--ink);font-size:14px;font-weight:600;padding:7px 11px;border-radius:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translateX(6px);transition:.25s;pointer-events:none}
#mascot .say.on{opacity:1;transform:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-22px) scale(1.12) rotate(-15deg)}70%{transform:translateY(0) scale(.95)}100%{transform:translateY(0) scale(1)}}
@media print{#mascot{display:none!important}}
@media (prefers-reduced-motion:reduce){#mascot .face{animation:none}}
</style>
</head>
<body>
<header>
  <h1>♨️ 温泉運搬記録</h1>
  <div class="sub">うちまち｜毎週木曜 温泉 → <span id="hDest">リュウオウ</span>　<span id="syncDot"></span></div>
</header>
<div id="weekBox"></div>
<nav>
  <button data-t="add" class="on">記録する</button>
  <button data-t="list">記録一覧</button>
  <button data-t="sum">集計・印刷</button>
  <button data-t="set">設定</button>
</nav>

<!-- 記録する -->
<section id="add" class="on">
  <div class="card">
    <div id="editNote" class="muted" style="display:none;margin-bottom:8px">✏️ 記録を直しています <button class="btn sm gray" id="cancelEdit">やめる</button></div>
    <label class="t">日付</label>
    <input type="date" id="fDate">
    <label class="t">この日は</label>
    <div class="seg" id="fKind"><button data-v="run" class="on">運んだ</button><button data-v="rest">休み・中止</button></div>
    <div id="runFields">
      <label class="t">担当者（タップで選ぶ・複数OK）</label>
      <div class="chips" id="fMembers"></div>
      <label class="t">時間</label>
      <div class="row"><input type="time" id="fStart"><span style="flex:none">〜</span><input type="time" id="fEnd"></div>
      <label class="t">運んだ量</label>
      <div class="row">
        <input type="number" id="fLiters" inputmode="numeric" placeholder="1回あたり">
        <span style="flex:none">L ×</span>
        <input type="number" id="fTrips" inputmode="numeric" value="1" style="max-width:70px">
        <span style="flex:none">往復</span>
      </div>
      <label class="t">車両</label>
      <input id="fCar" list="carList">
      <datalist id="carList"></datalist>
      <label class="t">天気</label>
      <div class="seg" id="fWeather"><button data-v="晴れ">☀️晴れ</button><button data-v="くもり">☁️くもり</button><button data-v="雨">☔雨</button></div>
      <label class="t">点検・作業チェック</label>
      <div class="checks" id="fChecks"></div>
      <label class="t">写真（1枚・任意）</label>
      <input type="file" id="fPhoto" accept="image/*">
      <div class="photoBox" id="photoPrev"></div>
    </div>
    <div id="restFields" style="display:none">
      <label class="t">理由</label>
      <input id="fReason" placeholder="例：祝日のため、雨天、機器点検中">
    </div>
    <label class="t">気づいたこと・備考</label>
    <textarea id="fNote" placeholder="例：ホースの継ぎ目から少し漏れ。次回パッキン交換"></textarea>
    <label class="t">記録した人</label>
    <select id="fBy"></select>
    <button class="btn wide" id="saveBtn">💾 記録を保存</button>
  </div>
</section>

<!-- 一覧 -->
<section id="list">
  <div class="card">
    <div class="row">
      <select id="lMonth"></select>
    </div>
    <div class="muted" style="margin-top:8px">赤いカードは「木曜なのに記録がない日」です。</div>
  </div>
  <div id="recList"></div>
</section>

<!-- 集計・印刷 -->
<section id="sum">
  <div class="card">
    <label class="t">期間</label>
    <div class="row"><select id="sYear"></select><select id="sMonth"></select></div>
  </div>
  <div class="card">
    <div class="stat">
      <div><b id="stRuns">0</b><span>運搬した回数</span></div>
      <div><b id="stLit">0</b><span>運んだ量(L)</span></div>
      <div><b id="stMiss">0</b><span>記録なしの木曜</span></div>
    </div>
  </div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:6px">メンバー別の出動回数</div>
    <div id="memBars"></div>
  </div>
  <div class="card">
    <button class="btn wide" id="printBtn" style="margin-top:0">🖨 記録簿を印刷（この期間）</button>
    <button class="btn wide gray" id="csvBtn">📄 CSVで書き出し（エクセル用）</button>
  </div>
</section>

<!-- 設定 -->
<section id="set">
  <div class="card">
    <label class="t">メンバー（「、」区切り）</label>
    <input id="sMembers">
    <label class="t">運搬先</label>
    <input id="sDest">
    <label class="t">汲む場所</label>
    <input id="sFrom">
    <label class="t">車両（「、」区切り・先頭がいつもの車）</label>
    <input id="sCars">
    <label class="t">点検・作業チェックの項目（「、」区切り）</label>
    <textarea id="sChecks"></textarea>
    <label class="t">いつもの量（1回あたりL）</label>
    <input type="number" id="sLiters" inputmode="numeric">
    <button class="btn wide" id="saveSet">設定を保存</button>
  </div>
  <div class="card">
    <div style="font-weight:600;margin-bottom:6px">☁️ みんなで共有</div>
    <div class="muted">保存するたびにクラウドへ送られ、開くたびに最新を読み込みます。だれのスマホで記録しても同じ一覧になります。</div>
    <div class="row" style="margin-top:10px">
      <button class="btn gray" id="cloudDown">☁️↓ 最新を読む</button>
      <button class="btn gray" id="cloudUp">☁️↑ 送る</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn gray" id="fileSave">💾 ファイルに保存</button>
      <button class="btn gray" id="fileLoad">📁 ファイルから戻す</button>
    </div>
    <input type="file" id="fileIn" accept=".json" style="display:none">
  </div>
</section>

<div id="printArea"></div>
<div id="toast"></div>

<script>
const SYNC_URL='https://script.google.com/macros/s/AKfycbxwL19mAenATUMILRsQYrDL0ThjU2C583Cj729OfzNHEH3drMcZCExYULRp4VGOZ11J/exec';
const SYNC_KEY='onsen_unpan_data';
const PHOTO_KEY='onsen_unpan_photo_';   // 写真は1枚ずつ別キー（本体を軽く保つ）
const LS='onsen_unpan_v1', LS_PHOTO='onsen_unpan_photos_v1';
const DEF_SET={
  members:['森脇','宇都宮','矢野','上田','有本','酒井'],
  dest:'リュウオウ', from:'温泉',
  cars:['軽トラ（89-02）'],
  checks:['タンク・ホースの点検','汲み上げ完了','運搬先へ給水完了','ホース・バルブの片付け','車両に異常なし'],
  liters:''
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsOK(){try{localStorage.setItem('__synctest','1');localStorage.removeItem('__synctest');return true;}catch(e){return false;}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2600);}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const WD='日月火水木金土';
const jdate=s=>{const d=new Date(s+'T00:00');return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')';};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

// ===== データ =====
let S={recs:[],set:JSON.parse(JSON.stringify(DEF_SET))};
let PH={};   // 写真 id→dataURL（この端末のキャッシュ）
try{const v=JSON.parse(localStorage.getItem(LS)||'null');if(v&&Array.isArray(v.recs))S=v;}catch(e){}
try{PH=JSON.parse(localStorage.getItem(LS_PHOTO)||'{}')||{};}catch(e){}
S.set=Object.assign({},DEF_SET,S.set||{});
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function savePH(){try{localStorage.setItem(LS_PHOTO,JSON.stringify(PH));}catch(e){
  // 端末の容量がいっぱい → 古い写真キャッシュから捨てる（クラウドには残っている）
  const ks=Object.keys(PH);ks.slice(0,Math.ceil(ks.length/2)).forEach(k=>delete PH[k]);try{localStorage.setItem(LS_PHOTO,JSON.stringify(PH));}catch(e2){}
}}
const live=()=>S.recs.filter(r=>!r.deleted);

// ===== 木曜チェック =====
const START_DATE='2026-10-08';   // これより前の木曜は「記録なし」扱いしない
function thursdays(from,to){const out=[];const d=new Date(from+'T00:00');while(d.getDay()!==4)d.setDate(d.getDate()+1);
  while(ymd(d)<=to){out.push(ymd(d));d.setDate(d.getDate()+7);}return out;}
function firstDate(){const ds=live().map(r=>r.date).sort();return ds.length&&ds[0]<START_DATE?ds[0]:START_DATE;}
function missingThursdays(from,to){const have=new Set(live().map(r=>r.date));
  const lim=today();return thursdays(from<firstDate()?firstDate():from,to<lim?to:lim).filter(d=>!have.has(d));}
function renderWeek(){
  const d=new Date();
  // 今週（月〜日）の木曜
  const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));const th=new Date(mon);th.setDate(mon.getDate()+3);
  const t=ymd(th);const recs=live().filter(r=>r.date>=ymd(mon)&&r.date<=ymd(new Date(mon.getTime()+6*864e5)));
  const box=$('weekBox');
  const miss=missingThursdays(firstDate(),ymd(new Date(mon.getTime()-864e5)));
  let html;
  if(recs.length){const r=recs[0];box.className='ok';
    html='✅ 今週（'+jdate(t)+'）記録済み：'+(r.kind==='rest'?'休み':esc((r.members||[]).join('・')));}
  else if(t>today()){box.className='ok';html='🗓 今週は '+jdate(t)+'。運んだら記録してください';}
  else{box.className='ng';html='⚠️ 今週（'+jdate(t)+'）の記録がまだです';}
  if(miss.length)html+='<div style="font-weight:500;font-size:14px;margin-top:4px;color:var(--warn)">記録なしの木曜が '+miss.length+'日 あります（一覧で確認）</div>';
  box.innerHTML=html;
}

// ===== 記録フォーム =====
let F={}; let editId=null; let newPhoto=null;
function setSeg(id,v){[...$(id).children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
function segVal(id){const b=$(id).querySelector('.on');return b?b.dataset.v:'';}
['fKind','fWeather'].forEach(id=>$(id).onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(id==='fWeather'&&b.classList.contains('on')){b.classList.remove('on');return;}
  setSeg(id,b.dataset.v);if(id==='fKind')kindView();});
function kindView(){const rest=segVal('fKind')==='rest';$('runFields').style.display=rest?'none':'';$('restFields').style.display=rest?'':'none';}
function renderForm(r){
  const st=S.set;
  $('fMembers').innerHTML=st.members.map(m=>'<button class="chip'+((r.members||[]).includes(m)?' on':'')+'" data-m="'+esc(m)+'">'+esc(m)+'</button>').join('');
  $('fChecks').innerHTML=st.checks.map(c=>'<label><input type="checkbox" data-c="'+esc(c)+'"'+((r.checks||[]).includes(c)?' checked':'')+'>'+esc(c)+'</label>').join('');
  $('carList').innerHTML=st.cars.map(c=>'<option value="'+esc(c)+'">').join('');
  const by=localStorage.getItem('onsen_me')||'';
  $('fBy').innerHTML='<option value="">（えらぶ）</option>'+st.members.map(m=>'<option'+((r.by||by)===m?' selected':'')+'>'+esc(m)+'</option>').join('');
  $('fDate').value=r.date||defaultDate();
  setSeg('fKind',r.kind||'run');kindView();
  $('fStart').value=r.start||'';$('fEnd').value=r.end||'';
  $('fLiters').value=r.liters??st.liters;$('fTrips').value=r.trips||1;
  $('fCar').value=r.car??(st.cars[0]||'');
  setSeg('fWeather',r.weather||'');
  $('fReason').value=r.reason||'';$('fNote').value=r.note||'';
  $('fPhoto').value='';newPhoto=null;
  showPhoto($('photoPrev'),r.photo?r.id:null);
  $('editNote').style.display=editId?'':'none';
  $('saveBtn').textContent=editId?'💾 直した内容で保存':'💾 記録を保存';
}
function defaultDate(){const d=new Date();if(d.getDay()===4)return today();
  // 木曜以外は直近の過去の木曜（その記録がまだなら）、なければ今日
  const p=new Date(d);p.setDate(d.getDate()-((d.getDay()+3)%7));const t=ymd(p);
  return live().some(r=>r.date===t)?today():t;}
$('fMembers').onclick=e=>{const b=e.target.closest('.chip');if(b)b.classList.toggle('on');};
$('cancelEdit').onclick=()=>{editId=null;renderForm({});};
$('fPhoto').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{newPhoto=await shrink(f);$('photoPrev').innerHTML='<img src="'+newPhoto+'">'+'<button class="btn sm gray" id="rmPh" style="margin-top:6px">写真を外す</button>';
    $('rmPh').onclick=()=>{newPhoto='';$('fPhoto').value='';$('photoPrev').innerHTML='';};}
  catch(err){toast('写真を読み込めませんでした');}};
function shrink(file){return new Promise((ok,ng)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{const M=900;let w=img.width,h=img.height;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.7));};
  img.onerror=ng;img.src=u;});}

$('saveBtn').onclick=()=>{
  const kind=segVal('fKind');const date=$('fDate').value;
  if(!date){toast('日付を入れてください');return;}
  const members=[...$('fMembers').querySelectorAll('.chip.on')].map(b=>b.dataset.m);
  if(kind==='run'&&!members.length){toast('担当者をえらんでください');return;}
  const by=$('fBy').value;if(by)try{localStorage.setItem('onsen_me',by);}catch(e){}
  const dup=live().find(r=>r.date===date&&r.id!==editId);
  if(dup&&!confirm(jdate(date)+' はもう記録があります。もう1件追加しますか？'))return;
  const old=editId?S.recs.find(r=>r.id===editId):null;
  const r={id:editId||uid(),date,kind,
    members:kind==='run'?members:[],start:$('fStart').value,end:$('fEnd').value,
    liters:$('fLiters').value===''?'':Number($('fLiters').value),trips:Number($('fTrips').value)||1,
    car:$('fCar').value.trim(),weather:segVal('fWeather'),
    checks:[...$('fChecks').querySelectorAll('input:checked')].map(i=>i.dataset.c),
    reason:$('fReason').value.trim(),note:$('fNote').value.trim(),by,
    photo:old?old.photo:false,
    createdAt:old?old.createdAt:Date.now(),updatedAt:Date.now()};
  if(kind==='rest'){r.start=r.end='';r.liters='';r.trips=0;r.checks=[];}
  let phPush=null;
  if(newPhoto){PH[r.id]=newPhoto;r.photo=true;phPush=newPhoto;savePH();}
  else if(newPhoto===''){delete PH[r.id];r.photo=false;savePH();phPush='';}
  if(old)Object.assign(old,r);else S.recs.push(r);
  save();editId=null;renderAll();renderForm({});
  toast('保存しました');setTimeout(()=>mascotSay('エクセレント！'),400);
  if(phPush!==null)pushPhoto(r.id,phPush);
  pushCloud(true);
  showTab('list');$('lMonth').value=date.slice(0,7);renderList();
};

// ===== 写真 =====
async function showPhoto(box,id){box.innerHTML='';if(!id)return;
  if(PH[id]){box.innerHTML='<img src="'+PH[id]+'">';return;}
  box.innerHTML='<div class="muted">写真を読み込み中…</div>';
  try{const r=await fetch(SYNC_URL+'?action=load&key='+PHOTO_KEY+id,{cache:'no-store'});const j=await r.json();
    const d=j&&j.success&&j.data&&j.data.img;if(d){PH[id]=d;savePH();box.innerHTML='<img src="'+d+'">';}else box.innerHTML='<div class="muted">写真はまだ届いていません</div>';}
  catch(e){box.innerHTML='<div class="muted">写真を読めませんでした（電波を確認）</div>';}}
async function pushPhoto(id,img){if(!lsOK())return;
  try{await fetch(SYNC_URL+'?action=save&key='+PHOTO_KEY+id,{method:'POST',body:JSON.stringify({img,savedAt:Date.now()})});}
  catch(e){const q=JSON.parse(localStorage.getItem('onsen_photo_q')||'[]');if(!q.includes(id))q.push(id);localStorage.setItem('onsen_photo_q',JSON.stringify(q));}}
async function retryPhotos(){if(!lsOK())return;let q=[];try{q=JSON.parse(localStorage.getItem('onsen_photo_q')||'[]');}catch(e){}
  if(!q.length)return;localStorage.setItem('onsen_photo_q','[]');for(const id of q){if(PH[id])await pushPhoto(id,PH[id]);}}

// ===== 一覧 =====
function monthsOpt(){const ms=new Set(live().map(r=>r.date.slice(0,7)));ms.add(today().slice(0,7));
  thursdays(firstDate(),today()).forEach(d=>ms.add(d.slice(0,7)));return [...ms].sort().reverse();}
function renderList(){
  const cur=$('lMonth').value||today().slice(0,7);
  $('lMonth').innerHTML=monthsOpt().map(m=>'<option value="'+m+'"'+(m===cur?' selected':'')+'>'+m.replace('-','年').replace(/^(\d+)年0?/,'$1年')+'月</option>').join('');
  const ym=$('lMonth').value;
  const recs=live().filter(r=>r.date.startsWith(ym));
  const miss=missingThursdays(ym+'-01',ym+'-31').map(d=>({date:d,miss:true}));
  const all=[...recs,...miss].sort((a,b)=>b.date.localeCompare(a.date));
  if(!all.length){$('recList').innerHTML='<div class="card muted">この月の記録はありません</div>';return;}
  $('recList').innerHTML=all.map(r=>{
    if(r.miss)return '<div class="card rec miss"><h3>'+jdate(r.date)+'<span style="color:var(--warn);font-size:14px">記録なし</span></h3>'+
      '<div class="acts"><button class="btn sm" data-new="'+r.date+'">この日の記録をつける</button></div></div>';
    if(r.kind==='rest')return '<div class="card rec rest"><h3>'+jdate(r.date)+'<span class="tag g">休み・中止</span></h3>'+
      '<div class="meta">'+esc(r.reason||'理由なし')+(r.note?'<br>📝 '+esc(r.note):'')+(r.by?'<br>記録：'+esc(r.by):'')+'</div>'+acts(r)+'</div>';
    const lit=r.liters!==''&&r.liters!=null?(r.liters*(r.trips||1)).toLocaleString()+'L'+(r.trips>1?'（'+r.liters+'L×'+r.trips+'）':''):'';
    const nc=S.set.checks.length, okc=(r.checks||[]).length;
    return '<div class="card rec"><h3>'+jdate(r.date)+'<span>'+(r.weather?'<span class="tag g">'+esc(r.weather)+'</span>':'')+'</span></h3>'+
      '<div class="meta">👥 '+esc((r.members||[]).join('・'))+
      (r.start||r.end?'<br>🕘 '+esc(r.start)+'〜'+esc(r.end):'')+
      (lit?'<br>♨️ '+lit:'')+(r.car?'<br>🚚 '+esc(r.car):'')+
      '<br>✅ 点検 '+okc+'/'+nc+(okc<nc?'<span class="tag" style="background:#fff3e0;color:var(--amber)">未チェックあり</span>':'')+
      (r.note?'<br>📝 '+esc(r.note):'')+(r.by?'<br>記録：'+esc(r.by):'')+'</div>'+
      (r.photo?'<div class="photoBox" data-ph="'+r.id+'"><button class="btn sm gray" style="margin-top:8px">📷 写真を見る</button></div>':'')+acts(r)+'</div>';
  }).join('');
}
const acts=r=>'<div class="acts"><button class="btn sm gray" data-ed="'+r.id+'">直す</button><button class="btn sm gray" data-del="'+r.id+'">消す</button></div>';
$('lMonth').onchange=renderList;
$('recList').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  const ph=b.closest('[data-ph]');if(ph){showPhoto(ph,ph.dataset.ph);return;}
  if(b.dataset.new){editId=null;renderForm({date:b.dataset.new});showTab('add');scrollTo(0,0);return;}
  if(b.dataset.ed){editId=b.dataset.ed;renderForm(S.recs.find(r=>r.id===editId));showTab('add');scrollTo(0,0);return;}
  if(b.dataset.del){const r=S.recs.find(x=>x.id===b.dataset.del);if(!confirm(jdate(r.date)+' の記録を消しますか？'))return;
    r.deleted=true;r.updatedAt=Date.now();save();renderAll();pushCloud(true);toast('消しました');}
};

// ===== 集計・印刷 =====
function renderSumSel(){
  const ys=[...new Set(monthsOpt().map(m=>m.slice(0,4)))];
  const cy=$('sYear').value||today().slice(0,4), cm=$('sMonth').value??'';
  $('sYear').innerHTML=ys.map(y=>'<option'+(y===cy?' selected':'')+'>'+y+'</option>').join('');
  $('sMonth').innerHTML='<option value="">年間</option>'+Array.from({length:12},(_,i)=>'<option value="'+pad(i+1)+'"'+(cm===pad(i+1)?' selected':'')+'>'+(i+1)+'月</option>').join('');
}
function period(){const y=$('sYear').value,m=$('sMonth').value;return m?[y+'-'+m+'-01',y+'-'+m+'-31',y+'年'+Number(m)+'月']:[y+'-01-01',y+'-12-31',y+'年'];}
function inPeriod(){const [a,b]=period();return live().filter(r=>r.date>=a&&r.date<=b).sort((x,y)=>x.date.localeCompare(y.date));}
function renderSum(){
  const recs=inPeriod();const runs=recs.filter(r=>r.kind==='run');
  $('stRuns').textContent=runs.length;
  $('stLit').textContent=runs.reduce((s,r)=>s+(Number(r.liters)||0)*(r.trips||1),0).toLocaleString();
  const [a,b]=period();$('stMiss').textContent=missingThursdays(a,b).length;
  const cnt={};S.set.members.forEach(m=>cnt[m]=0);runs.forEach(r=>(r.members||[]).forEach(m=>cnt[m]=(cnt[m]||0)+1));
  const mx=Math.max(1,...Object.values(cnt));
  $('memBars').innerHTML=Object.entries(cnt).sort((x,y)=>y[1]-x[1]).map(([m,c])=>
    '<div class="bar"><span class="n">'+esc(m)+'</span><span class="b"><i style="width:'+(c/mx*100)+'%"></i></span><span class="c">'+c+'回</span></div>').join('');
}
$('sYear').onchange=renderSum;$('sMonth').onchange=renderSum;
$('printBtn').onclick=()=>{
  const recs=inPeriod();const [a,b,label]=period();
  const rows=[...recs,...missingThursdays(a,b).map(d=>({date:d,miss:true}))].sort((x,y)=>x.date.localeCompare(y.date));
  const st=S.set;
  $('printArea').innerHTML='<h2>温泉運搬 作業記録簿　'+esc(label)+'</h2>'+
    '<div style="font-size:12px;margin-bottom:6px">団体：うちまち　｜　'+esc(st.from)+' → '+esc(st.dest)+'　｜　印刷日 '+today()+'</div>'+
    '<table class="book"><tr><th>No</th><th>日付</th><th>区分</th><th>担当者</th><th>時間</th><th>運搬量(L)</th><th>車両</th><th>天気</th><th>点検</th><th>備考</th><th>記録者</th><th>確認印</th></tr>'+
    rows.map((r,i)=>r.miss?'<tr><td>'+(i+1)+'</td><td>'+jdate(r.date)+'</td><td colspan="10" class="l" style="color:#c62828">記録なし</td></tr>':
      '<tr><td>'+(i+1)+'</td><td>'+jdate(r.date)+'</td><td>'+(r.kind==='rest'?'休み':'実施')+'</td><td class="l">'+esc((r.members||[]).join('・'))+'</td>'+
      '<td>'+(r.start||r.end?esc(r.start)+'〜'+esc(r.end):'')+'</td><td>'+(r.kind==='run'&&r.liters!==''?(r.liters*(r.trips||1)).toLocaleString():'')+'</td>'+
      '<td>'+esc(r.car||'')+'</td><td>'+esc(r.weather||'')+'</td><td>'+(r.kind==='run'?(r.checks||[]).length+'/'+st.checks.length:'')+'</td>'+
      '<td class="l">'+esc([r.reason,r.note].filter(Boolean).join(' / '))+'</td><td>'+esc(r.by||'')+'</td><td style="width:50px"></td></tr>').join('')+
    '</table><div style="font-size:12px;margin-top:6px">実施 '+recs.filter(r=>r.kind==='run').length+'回　運搬量合計 '+
      recs.filter(r=>r.kind==='run').reduce((s,r)=>s+(Number(r.liters)||0)*(r.trips||1),0).toLocaleString()+'L　点検項目：'+esc(st.checks.join('、'))+'</div>';
  window.print();
};
$('csvBtn').onclick=()=>{
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[['日付','区分','担当者','開始','終了','1回量L','往復','合計L','車両','天気','点検済み','理由','備考','記録者'].map(q).join(',')];
  inPeriod().forEach(r=>lines.push([r.date,r.kind==='rest'?'休み':'実施',(r.members||[]).join('・'),r.start,r.end,r.liters,r.kind==='run'?r.trips:'',
    r.kind==='run'&&r.liters!==''?r.liters*(r.trips||1):'',r.car,r.weather,(r.checks||[]).join('・'),r.reason,r.note,r.by].map(q).join(',')));
  download('温泉運搬記録_'+period()[2]+'.csv','﻿'+lines.join('\r\n'),'text/csv');
};

// ===== 設定 =====
const split=s=>s.split(/[,、，\n]/).map(x=>x.trim()).filter(Boolean);
function renderSet(){const st=S.set;$('sMembers').value=st.members.join('、');$('sDest').value=st.dest;$('sFrom').value=st.from;
  $('sCars').value=st.cars.join('、');$('sChecks').value=st.checks.join('、');$('sLiters').value=st.liters;$('hDest').textContent=st.dest;}
$('saveSet').onclick=()=>{const m=split($('sMembers').value);if(!m.length){toast('メンバーを入れてください');return;}
  S.set={members:m,dest:$('sDest').value.trim()||'リュウオウ',from:$('sFrom').value.trim()||'温泉',cars:split($('sCars').value),
    checks:split($('sChecks').value),liters:$('sLiters').value===''?'':Number($('sLiters').value),updatedAt:Date.now()};
  save();renderAll();if(!editId)renderForm({});pushCloud(true);toast('設定を保存しました');};

// ===== クラウド =====
function mergeRecs(a,b){const m={};[...a,...b].forEach(x=>{if(!m[x.id]||(x.updatedAt||0)>(m[x.id].updatedAt||0))m[x.id]=x;});return Object.values(m);}
async function fetchCloud(){const r=await fetch(SYNC_URL+'?action=load&key='+SYNC_KEY,{cache:'no-store'});const j=await r.json();
  return (j&&j.success&&j.data&&Array.isArray(j.data.recs))?j.data:null;}
function absorb(c){S.recs=mergeRecs(S.recs,c.recs);if(c.set&&(c.set.updatedAt||0)>(S.set.updatedAt||0))S.set=Object.assign({},DEF_SET,c.set);}
let pushing=false;
async function pushCloud(silent){
  if(!lsOK())return;                       // プレビュー等 localStorage の無い環境からは送らない
  if(pushing)return;pushing=true;dot('送信中…');
  try{const c=await fetchCloud().catch(()=>null);if(c){absorb(c);save();}
    if(!S.recs.length&&!S.set.updatedAt){dot('');return;}
    const r=await fetch(SYNC_URL+'?action=save&key='+SYNC_KEY,{method:'POST',body:JSON.stringify({recs:S.recs,set:S.set,savedAt:Date.now()})});
    const j=await r.json();dot(j.success?'☁️共有済み':'☁️未送信');if(!silent)toast(j.success?'☁️ 送りました':'☁️ 送れませんでした');
    if(c)renderAll();
  }catch(e){dot('☁️未送信（電波なし）');if(!silent)toast('☁️ 電波がないため端末だけに保存しています');}
  finally{pushing=false;}
}
async function pullCloud(silent){
  try{dot('読込中…');const c=await fetchCloud();if(c){absorb(c);save();renderAll();if(!editId)renderForm({});}
    dot('☁️最新');if(!silent)toast(c?'最新を読み込みました（'+live().length+'件）':'クラウドにはまだ記録がありません');
    // この端末にしかない記録があれば送る
    if(c&&S.recs.some(r=>!c.recs.find(x=>x.id===r.id&&(x.updatedAt||0)>=(r.updatedAt||0))))pushCloud(true);
    else if(!c&&S.recs.length)pushCloud(true);
  }catch(e){dot('☁️オフライン');if(!silent)toast('読み込めませんでした（電波を確認）');}
}
function dot(t){$('syncDot').textContent=t;}
$('cloudUp').onclick=()=>pushCloud(false);
$('cloudDown').onclick=()=>pullCloud(false);
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();}
$('fileSave').onclick=()=>download('温泉運搬記録_'+today()+'.json',JSON.stringify(S,null,1),'application/json');
$('fileLoad').onclick=()=>$('fileIn').click();
$('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const v=JSON.parse(rd.result);
  if(!Array.isArray(v.recs))throw 0;S.recs=mergeRecs(S.recs,v.recs);if(v.set)S.set=Object.assign({},DEF_SET,v.set);save();renderAll();pushCloud(true);toast('ファイルから戻しました');}
  catch(err){toast('読めないファイルです');}};rd.readAsText(f);};

// ===== タブ =====
function showTab(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));
  if(t==='list')renderList();if(t==='sum'){renderSumSel();renderSum();}}
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(b)showTab(b.dataset.t);};
function renderAll(){renderWeek();renderSet();if($('list').classList.contains('on'))renderList();if($('sum').classList.contains('on')){renderSumSel();renderSum();}}

renderAll();renderForm({});
// ===== 理事長マスコット =====
const MASCOT_LINES=['エクセレント！','今週も運んだ？','記録はちゃんとつけてな','ご苦労さん！','リュウオウまで安全運転で','ホースの片付けよろしく'];
function mascotSay(t){const m=$('mascot'),sy=m.querySelector('.say');sy.textContent=t;sy.classList.add('on');
  m.classList.remove('jump');void m.offsetWidth;m.classList.add('jump');
  clearTimeout(sy._h);sy._h=setTimeout(()=>sy.classList.remove('on'),2400);}
$('mascot').onclick=()=>mascotSay(MASCOT_LINES[Math.floor(Math.random()*MASCOT_LINES.length)]);
pullCloud(true).then(retryPhotos);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullCloud(true);});
</script>
