<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ワンコイン商店街</title>
<style>
:root{
  --bg:#faf6ee; --card:#ffffff; --ink:#2a2420; --sub:#7a6e64; --line:#ece3d4;
  --gold:#c99a2e; --gold-soft:#fbf0d4; --red:#c8442f; --red-soft:#fbe5e0;
  --green:#3d8a5a; --green-soft:#e2f2e7; --blue:#3a6ea5; --blue-soft:#e3edf8;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 4px 14px rgba(60,40,10,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1915; --card:#27231e; --ink:#f1ebe2; --sub:#a99d90; --line:#3a342c;
  --gold:#e0b350; --gold-soft:#3a3020; --red:#ec7a64; --red-soft:#3d2520;
  --green:#6cc08a; --green-soft:#1f3326; --blue:#7fb0e6; --blue-soft:#1f2c3b;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 80px}
header.hero{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.coin{flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#d9a93a 60%,#a97a1c);display:grid;place-items:center;color:#5a3e05;font-weight:800;font-size:15px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35),0 2px 6px rgba(120,80,10,.3);text-align:center;line-height:1.1}
.hero h1{margin:0;font-size:24px;letter-spacing:.02em}
.kai{display:block;font-size:14px;color:var(--gold);font-weight:800;letter-spacing:.08em}
.hero .date{font-size:14px;color:var(--sub)}
.count{display:inline-block;margin-top:4px;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 4px;font-size:15px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:700}
.note{font-size:13px;color:var(--sub);margin:2px 0 10px}
.list{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:720px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:360px){.ib{min-width:36px;height:36px}.name h2{font-size:16px}.wrap{padding-left:12px;padding-right:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;box-shadow:var(--shadow);position:relative}
.card.mine{border:2px solid var(--red)}
.top{display:flex;align-items:flex-start;gap:10px}
.no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;font-weight:800;font-size:14px}
.name{flex:1;min-width:0}
.name h2{margin:0;font-size:18px;line-height:1.3}
.name .rep{font-size:12px;color:var(--sub)}
.mine-badge{display:inline-block;background:var(--red);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.btns{display:flex;gap:6px;flex:none}
.ib{border:1px solid var(--line);background:var(--bg);color:var(--sub);border-radius:10px;min-width:44px;height:40px;font-size:13px;font-weight:700;cursor:pointer;padding:0 8px}
.ib.on.check{background:var(--green);border-color:var(--green);color:#fff}
.items{list-style:none;margin:8px 0 6px;padding:0;display:grid;gap:4px}
.items li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;font-size:15px}
.items li::before{content:"・";color:var(--gold)}
.pill{font-size:12px;border-radius:6px;padding:0 6px;white-space:nowrap}
.pill.q{background:var(--blue-soft);color:var(--blue)}
.pill.few{background:var(--red-soft);color:var(--red);font-weight:700}
.pill.p{background:var(--gold-soft);color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.place{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--green-soft);color:var(--green)}
.place.away{background:var(--red-soft);color:var(--red);font-weight:700}
.cat{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.empty{text-align:center;color:var(--sub);padding:30px 0}
.foot{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.foot .fb{flex:1 1 auto;padding:8px 10px;font-size:13px}
.fb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer}
.items li.sold>span:first-child{text-decoration:line-through;color:var(--sub)}
.pill.sold{background:var(--red);color:#fff;font-weight:800}
.card.allsold{background:var(--bg)}
.kanbai{display:inline-block;background:var(--red);color:#fff;border-radius:6px;font-size:12px;padding:1px 7px;margin-left:6px;vertical-align:2px;font-weight:800}
.sbtn{border:1.5px dashed var(--sub);background:var(--bg);color:var(--sub);border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px;cursor:pointer;margin-left:auto;white-space:nowrap}
.sbtn:hover{border-style:solid;color:var(--ink)}
.sbtn.on{border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.soldhint{font-size:13px;background:var(--red-soft);color:var(--red);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-weight:700}
.fb.soldmode.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:800}
.soldinfo{font-size:13px;color:var(--red);font-weight:700;margin:-4px 0 10px}
#passDlg{border:none;border-radius:16px;padding:0;width:min(420px,calc(100vw - 24px));background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
#passDlg::backdrop{background:rgba(0,0,0,.45)}
#pf{padding:16px;display:grid;gap:10px}#pf h3{margin:0;font-size:19px}#pf p{margin:0;font-size:13px;color:var(--sub)}
#pf input{font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#pf .r{display:flex;gap:8px;justify-content:flex-end}
#pf button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
#pf .primary{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:800}
.fb.add{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:800}
.ib.edit{font-size:12px;color:var(--ink)}
.newb{display:inline-block;background:var(--blue);color:#fff;border-radius:6px;font-size:11px;padding:1px 6px;margin-left:6px;vertical-align:2px}
dialog#dlg{border:none;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 24px);background:var(--card);color:var(--ink);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog#dlg::backdrop{background:rgba(0,0,0,.45)}
#f{padding:16px;display:grid;gap:10px}
#f h3{margin:0 0 2px;font-size:19px}
#f label{display:grid;gap:3px;font-size:13px;color:var(--sub);font-weight:700}
#f input[type=text],#f input[type=number]{font-size:16px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;font-weight:400}
#f fieldset{border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;margin:0;display:grid;gap:6px}
#f legend{font-size:13px;color:var(--sub);font-weight:700;padding:0 4px}
#f .row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#f .cbs{display:flex;flex-wrap:wrap;gap:6px}
#f .cbs label{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink);font-weight:400;font-size:14px;cursor:pointer}
#f .dlgbtns{display:flex;gap:8px;align-items:center;margin-top:4px}
#f .dlgbtns .sp{flex:1}
#f .dlgbtns button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
#f .dlgbtns .primary{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:800}
#f .dlgbtns .danger{color:var(--red);border-color:var(--red-soft)}
#f .hint{font-size:12px;color:var(--sub);margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@page{size:A4 portrait;margin:7mm}
@media print{
  :root,:root:not([data-theme="light"]){--bg:#fff;--card:#fff;--ink:#000;--sub:#555;--line:#bbb;--gold:#c99a2e;--gold-soft:#f6e7bf;--red:#c8442f;--red-soft:#fbe5e0;--green:#2f6e47;--green-soft:#e2f2e7;--blue:#2a5a90;--blue-soft:#e3edf8}
  html,body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tabs,.search,.chips,.btns,.foot,.stats,.note,.toast,.count,.cat,dialog,.newb,.sbtn,.soldinfo,.soldhint,#list{display:none!important}
  #plist{display:grid!important}
  .wrap{max-width:none;padding:0;zoom:var(--pz,1);width:calc(196mm / var(--pz,1))}
  header.hero{margin:0 0 2mm;gap:8px}
  .hero h1{font-size:19px;display:inline}.kai{display:inline;font-size:15px;margin-right:6px}.hero .date{display:inline;margin-left:8px;font-size:13px}
  .coin{width:26px;height:26px;font-size:7px;box-shadow:none}
  .list{grid-template-columns:1fr 1fr!important;gap:1.6mm}
  .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;padding:1mm 2mm 1.2mm;border-radius:4px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:4px;align-content:start}
  .card .top{grid-column:1;grid-row:1}.card .meta{grid-column:2;grid-row:1;align-self:center}.card .items{grid-column:1/-1}
  .card.mine{border-width:1.5px}
  .top{gap:5px;align-items:center}
  .no{width:23px;height:23px;font-size:12.5px}
  .name{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .name h2{font-size:17.5px}.name .rep{font-size:11px}
  .mine-badge{font-size:9.5px;padding:0 4px;vertical-align:1px}
  .items{margin:.4mm 0 0 28px;gap:0}
  .items li{font-size:14.5px;line-height:1.35;gap:4px}.items li{flex-wrap:nowrap}.items li>span:first-child{min-width:0;letter-spacing:-.02em}
  .pill{font-size:12px;padding:0 3px}
  .place{font-size:12px;padding:0 4px}
}
/* 印刷の見た目を画面で一瞬だけ再現して高さを測る用（印刷用の設定と同じ中身） */
body.pm .wrap{width:196mm;max-width:none;padding:0}
body.pm .tabs,body.pm .search,body.pm .chips,body.pm .btns,body.pm .foot,body.pm .stats,body.pm .note,body.pm .toast,body.pm .count,body.pm .cat,body.pm dialog,body.pm .newb,body.pm .sbtn,body.pm .soldinfo,body.pm .soldhint,body.pm #list{display:none!important}
body.pm #plist{display:grid!important}
body.pm .wrap{max-width:none;padding:0}
body.pm header.hero{margin:0 0 2mm;gap:8px}
body.pm .hero h1{font-size:19px;display:inline}
body.pm .kai{display:inline;font-size:15px;margin-right:6px}
body.pm .hero .date{display:inline;margin-left:8px;font-size:13px}
body.pm .coin{width:26px;height:26px;font-size:7px;box-shadow:none}
body.pm .list{grid-template-columns:1fr 1fr!important;gap:1.6mm}
body.pm .card{box-shadow:none;break-inside:avoid;page-break-inside:avoid;padding:1mm 2mm 1.2mm;border-radius:4px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:4px;align-content:start}
body.pm .card .top{grid-column:1;grid-row:1}
body.pm .card .meta{grid-column:2;grid-row:1;align-self:center}
body.pm .card .items{grid-column:1/-1}
body.pm .card.mine{border-width:1.5px}
body.pm .top{gap:5px;align-items:center}
body.pm .no{width:23px;height:23px;font-size:12.5px}
body.pm .name{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
body.pm .name h2{font-size:17.5px}
body.pm .name .rep{font-size:11px}
body.pm .mine-badge{font-size:9.5px;padding:0 4px;vertical-align:1px}
body.pm .items{margin:.4mm 0 0 28px;gap:0}
body.pm .items li{font-size:14.5px;line-height:1.35;gap:4px}
body.pm .items li{flex-wrap:nowrap}
body.pm .items li>span:first-child{min-width:0;letter-spacing:-.02em}
body.pm .pill{font-size:12px;padding:0 3px}
body.pm .place{font-size:12px;padding:0 4px}
#plist{display:none}

</style>

<body>
<div class="wrap">
  <header class="hero">
    <div class="coin">ワン<br>コイン</div>
    <div>
      <h1><span class="kai">第34回</span>ワンコイン商店街</h1>
      <div class="date">2026年11月28日（土）・参加店 <span id="dCount">24</span>店</div>
      <div class="count" id="count"></div>
    </div>
  </header>


  <div class="foot">
    <button class="fb add" id="addBtn">＋お店を新規登録</button>
    <button class="fb soldmode" id="soldBtn">売り切れを付ける</button>
    <button class="fb" id="printBtn">一覧を印刷（A4）</button>
  </div>

  <div class="soldhint" id="soldHint" hidden>売り切れ入力中：売り切れた商品の「押すと売り切れ」を押してください。赤い「売り切れ」が付いたものだけが売り切れです。</div>
  <div class="soldinfo" id="soldInfo" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="all" aria-selected="true">ぜんぶ</button>
    <button class="tab" role="tab" data-tab="away" aria-selected="false">店の外で出店</button>
  </div>

  <input class="search" id="q" type="search" placeholder="店名・商品でさがす（例：カレー、くじ）">
  <div class="chips" id="chips"></div>
  <div class="note" id="note"></div>

  <div class="list" id="list"></div>
  <div class="list" id="plist" aria-hidden="true"></div>

</div>
<div class="toast" id="toast"></div>

<dialog id="passDlg">
  <form id="pf" method="dialog">
    <h3>🔒 お店の人用</h3>
    <p>売り切れを付けるには、<b>売り切れ用の合言葉</b>を入れてください。この端末では次から入れなくてOKです。</p>
    <input type="password" id="passIn" inputmode="numeric" autocomplete="off" placeholder="売り切れ用の合言葉">
    <div class="r"><button type="button" id="passCancel">やめる</button><button type="submit" class="primary">開く</button></div>
  </form>
</dialog>

<dialog id="dlg">
  <form id="f" method="dialog" autocomplete="off">
    <h3 id="dlgTitle">お店を新規登録</h3>
    <label>店名（必ず）<input type="text" name="shopname" required placeholder="例：〇〇商店"></label>
    <label id="repRow">代表者名<input type="text" name="rep" placeholder="Macの中だけに残ります（公開版には出ません）"></label>
    <fieldset><legend>商品1</legend>
      <input type="text" name="t1" placeholder="品名（例：焼きそば）">
      <div class="row"><input type="number" name="q1" inputmode="numeric" min="1" placeholder="数量（個）"><input type="text" name="p1" placeholder="値段（例：500円）"></div>
    </fieldset>
    <fieldset><legend>商品2（なければ空欄）</legend>
      <input type="text" name="t2" placeholder="品名">
      <div class="row"><input type="number" name="q2" inputmode="numeric" min="1" placeholder="数量（個）"><input type="text" name="p2" placeholder="値段"></div>
    </fieldset>
    <label>出店場所<input type="text" name="place" placeholder="空欄なら「自店」（例：内子座駐車場）"></label>
    <div><div style="font-size:13px;color:var(--sub);font-weight:700;margin-bottom:4px">分類（いくつでも）</div><div class="cbs" id="cbs"></div></div>
    <p class="hint">登録すると、スマホの公開版にも自動で出ます（代表者名は出ません）。</p>
    <div class="dlgbtns">
      <button type="button" class="danger" id="delBtn">この店を消す</button>
      <span class="sp"></span>
      <button type="button" id="cancelBtn">やめる</button>
      <button type="submit" class="primary" id="okBtn">登録する</button>
    </div>
  </form>
</dialog>

<script>
const EVENT_DATE = new Date(2026, 10, 28);
// ===== 最新版チェック（公開版を開いた人も自動で最新に。版は公開するたびに道具が書き換える）=====
const APP_VERSION = '20261117-233742';
function checkLatest(){
  if(location.protocol !== 'https:') return;
  fetch(location.pathname + '?v=' + Date.now(), {cache:'no-store'})
    .then(r => r.ok ? r.text() : '')
    .then(t => {
      const m = t.match(/const APP_VERSION = '([^']+)'/);
      if(!m || m[1] === APP_VERSION) return;
      let tried = ''; try{ tried = sessionStorage.getItem('onecoin_reload_to') || ''; }catch(e){}
      if(tried === m[1]) return;                         // 同じ版へ何度も読み直さない
      try{ sessionStorage.setItem('onecoin_reload_to', m[1]); }catch(e){}
      location.replace(location.pathname + '?v=' + encodeURIComponent(m[1]));
    }).catch(() => {});
}
checkLatest();
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkLatest(); });
const MY_SHOP = 0;   // 0＝特別扱いなし（全店平等・番号順）
const KEY = 'onecoin_20261128';
const CAN_EDIT = false;   // 公開版では false（見るだけ）
const ADD_KEY = 'onecoin34_added';          // Mac内の控え（代表者名あり）
const CLOUD_KEY = 'onecoin34_added';        // クラウド（代表者名なし）
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbxwL19mAenATUMILRsQYrDL0ThjU2C583Cj729OfzNHEH3drMcZCExYULRp4VGOZ11J/exec';
const CATS = ['たべもの','おかし','雑貨・もの','くじ・あそび','サービス','マルシェ・イベント'];
const ICON = {'たべもの':'🍚','おかし':'🍰','雑貨・もの':'🛍','くじ・あそび':'🎯','サービス':'✂️','マルシェ・イベント':'🎪'};

// q=数量 / p=値段・条件
const SHOPS = [
 {no:1, name:'井上商店', rep:'', cats:['おかし','雑貨・もの'], items:[{t:'クッキー',q:250},{t:'ニット帽子・かご',q:5,qs:'各5個'}]},
 {no:2, name:'かつ盛', rep:'', cats:['たべもの'], items:[{t:'たいさつま汁',q:50},{t:'タイのあら炊き 他',q:50}]},
 {no:3, name:'かっとハウス ホワイト', rep:'', cats:['くじ・あそび'], items:[{t:'くじびき',q:300}]},
 {no:4, name:'坂見輝月堂', rep:'', cats:['おかし'], items:[{t:'シュークリーム',q:100},{t:'ボーロ（5個入り）',q:50}]},
 {no:5, name:'菓子と器の宮栄', rep:'', cats:['くじ・あそび'], items:[{t:'クジ引き芋すくい',q:300}]},
 {no:6, name:'タニオ', rep:'', cats:['雑貨・もの'], place:'本川邸駐車場', items:[{t:'おもちゃ'}]},

const BASE = SHOPS.slice();
let added = {savedAt:0, shops:[]};
try{ const a = JSON.parse(localStorage.getItem(ADD_KEY)||'null'); if(a && Array.isArray(a.shops)) added = a; }catch(e){}
function rebuild(){ SHOPS.length = 0; SHOPS.push(...BASE, ...added.shops); }
rebuild();

const SOLD_KEY = 'onecoin34_soldout';      // Mac内の控え／クラウドも同じ名前
let sold = {savedAt:0, s:{}};
try{ const a = JSON.parse(localStorage.getItem(SOLD_KEY)||'null'); if(a && a.s) sold = a; }catch(e){}
let soldMode = false;


let tab='all', cat='', query='';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.normalize('NFKC').toLowerCase().replace(/[ァ-ン]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s/g,'');

function countdown(){
  const t = new Date(); t.setHours(0,0,0,0);
  const d = Math.round((EVENT_DATE - t)/86400000);
  $('count').textContent = d > 0 ? `あと ${d} 日` : d === 0 ? '今日が本番！' : 'おつかれさまでした';
}

function chips(){
  $('chips').innerHTML = ['',...CATS].map(c =>
    `<button class="chip" data-cat="${c}" aria-pressed="${c===cat}">${c ? ICON[c]+' '+c : 'すべて'}</button>`).join('');
}

function itemHTML(it, s, i){
  const k = s.no + '-' + i, isSold = !!sold.s[k];
  let h = `<span>${esc(it.t)}</span>`;
  if(isSold){
    h += `<span class="pill sold">売り切れ</span>`;
    if(soldMode) h += `<button class="sbtn on" data-sold="${k}">↩ 戻す</button>`;
    return `<li class="sold">${h}</li>`;
  }
  if(it.p) h += `<span class="pill p">${esc(it.p)}</span>`;
  if(it.q){
    const few = it.q <= 50;
    h += `<span class="pill ${few?'few':'q'}">${esc(it.qs || it.q+'個')}${few?'・早めに':''}</span>`;
  }
  if(soldMode) h += `<button class="sbtn" data-sold="${k}">押すと売り切れ</button>`;
  return `<li>${h}</li>`;
}
function allSold(s){ return s.items.length > 0 && s.items.every((_, i) => sold.s[s.no + '-' + i]); }

function cardHTML(s){ return `
    <article class="card${s.no===MY_SHOP?' mine':''}${allSold(s)?' allsold':''}">
      <div class="top">
        <div class="no">${s.no}</div>
        <div class="name">
          <h2>${esc(s.name)}${s.no===MY_SHOP?'<span class="mine-badge">うちの店</span>':''}${s.added?'<span class="newb">追加</span>':''}${allSold(s)?'<span class="kanbai">完売</span>':''}</h2>
          ${s.rep?`<div class="rep">${esc(s.rep)}</div>`:''}
        </div>
        <div class="btns">
          ${(CAN_EDIT || signer) && s.added ? `<button class="ib edit" data-act="edit" data-no="${s.no}">直す</button>` : ''}
        </div>
      </div>
      <ul class="items">${s.items.length ? s.items.map((it, i) => itemHTML(it, s, i)).join('') : '<li><span>（内容はまだ）</span></li>'}</ul>
      <div class="meta">
        <span class="place${s.place?' away':''}">📍 ${s.place?esc(s.place):'自店'}</span>
        ${s.cats.map(c=>`<span class="cat">${ICON[c]} ${c}</span>`).join('')}
      </div>
    </article>`; }

function render(){
  let list = SHOPS.slice();
  if(tab==='away') list = list.filter(s => s.place);
  if(cat) list = list.filter(s => s.cats.includes(cat));
  if(query){
    const q = norm(query);
    list = list.filter(s => norm([s.name, s.rep||'', s.place||'', ...s.items.map(i=>i.t), ...s.cats].join(' ')).includes(q));
  }
  // うちの店を先頭に
  list.sort((a,b) => (b.no===MY_SHOP) - (a.no===MY_SHOP) || a.no - b.no);

  $('list').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="empty">見つかりませんでした</div>`;

  const nSold = Object.values(sold.s).filter(Boolean).length;
  if(nSold){ const t = new Date(sold.savedAt); $('soldInfo').hidden = false;
    $('soldInfo').textContent = `売り切れ ${nSold}品（${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')} 更新）`; }
  else $('soldInfo').hidden = true;
  $('dCount').textContent = SHOPS.length;
  // 印刷用：絞り込み・検索に関係なく全店を番号順で（どの印刷方法でも同じ一覧）
  const sm = soldMode; soldMode = false;
  $('plist').innerHTML = SHOPS.slice().sort((a,b) => a.no - b.no).map(cardHTML).join('');
  soldMode = sm;
  fitPrint();
  $('note').textContent = `${list.length}店を表示中` + (tab==='away'?'（自分の店ではない場所で出店する店）':'') + '　赤い「早めに」は50個以下＝売り切れ注意';
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ tab = t.dataset.tab; document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b===t)); render(); }
  else if(t.dataset.cat!==undefined){ cat = t.dataset.cat; chips(); render(); }
  else if(t.dataset.sold){ toggleSold(t.dataset.sold); }
  else if(t.dataset.act==='edit'){ openDlg(+t.dataset.no); }
});
$('q').addEventListener('input', e => { query = e.target.value.trim(); render(); });

// 印刷がA4一枚に収まるよう、高さを測って縮める（店が増えても1枚）
function fitPrint(){
  const b = document.body; b.classList.add('pm');
  const h = document.querySelector('.wrap').scrollHeight;
  b.classList.remove('pm');
  const avail = 283 * 96 / 25.4 * 0.97;               // A4縦の印刷できる高さ（余白7mm）
  document.documentElement.style.setProperty('--pz', h > avail ? (avail / h).toFixed(3) : '1');
}
window.addEventListener('beforeprint', fitPrint);
// LINEなどアプリの中の画面は印刷できないので、Safari等で開き直してもらう
const INAPP = /\bLine\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent);
$('printBtn').onclick = () => {
  if(INAPP){
    if(/\bLine\//i.test(navigator.userAgent)){
      if(confirm('LINEの中の画面からは印刷できません。\nSafariで開き直します。開いたら、もう一度「一覧を印刷（A4）」を押してください。')){
        const u = new URL(location.href); u.searchParams.set('openExternalBrowser', '1'); location.href = u.toString();
      }
    }else alert('アプリの中の画面からは印刷できません。右上の「…」から「ブラウザで開く」を選んで、もう一度押してください。');
    return;
  }
  fitPrint();
  try{ window.print(); }catch(e){ alert('この画面からは印刷できません。Safariで開いてください。'); }
};
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }

// ===== 合言葉と署名（クラウドの中身は誰でも書けるので、合言葉を知る人の署名つきだけを表示する） =====
const PUB_JWK = {"kty": "EC", "crv": "P-256", "x": "iTCdhreZ13LiloNbxe3qGBRgO4t1aWgBcCzSM__GYDk", "y": "kuxrJovMPr1PZ5Vg4HRfOJTFxA0hedNZUAtkFbCtzQM"};
const PASS_KEY = 'onecoin34_pass', SIGNKEY_KEY = 'onecoin34_signkey';
const te = new TextEncoder(), td = new TextDecoder();
const ub64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
const tb64 = b => { let r = ''; new Uint8Array(b).forEach(c => r += String.fromCharCode(c)); return btoa(r); };
let signer = null, verifier = null;
async function rawLoad(key){
  const r = await fetch(SYNC_URL + '?action=load&key=' + key + '&t=' + Date.now());
  const j = await r.json(); let d = j && j.data;
  if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){ d = null; } }
  return d;
}
async function makeSigner(pass){
  const e = await rawLoad(SIGNKEY_KEY); if(!e || !e.ct) throw new Error('nokey');
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub64(e.salt), iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const jwk = JSON.parse(td.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:ub64(e.iv)}, k, ub64(e.ct))));
  return crypto.subtle.importKey('jwk', {kty:jwk.kty, crv:jwk.crv, x:jwk.x, y:jwk.y, d:jwk.d}, {name:'ECDSA', namedCurve:'P-256'}, false, ['sign']);
}
function askPass(){
  return new Promise(res => {
    const d = $('passDlg'); $('passIn').value = ''; let done = false;
    const fin = v => { if(done) return; done = true; d.close(); res(v); };
    $('pf').onsubmit = e => { e.preventDefault(); fin($('passIn').value.trim() || null); };
    $('passCancel').onclick = () => fin(null);
    d.onclose = () => fin(null);
    d.showModal(); setTimeout(() => $('passIn').focus(), 50);
  });
}
async function ensureSigner(noAsk){
  if(signer) return true;
  let pass = null; try{ pass = localStorage.getItem(PASS_KEY); }catch(e){}
  if(pass){
    try{ signer = await makeSigner(pass); return true; }
    catch(e){ if(e.name !== 'OperationError'){ if(!noAsk) toast('確認できませんでした（電波を確認してください）'); return false; } }
  }
  if(noAsk) return false;
  pass = await askPass(); if(!pass) return false;
  try{ signer = await makeSigner(pass); try{ localStorage.setItem(PASS_KEY, pass); }catch(e){} toast('🔓 合言葉OK'); return true; }
  catch(e){ alert(e.name === 'OperationError' ? '合言葉が違います' : '確認できませんでした（電波を確認してください）'); return false; }
}
async function signedSave(key, obj){
  const body = JSON.stringify(obj);
  const sig = tb64(await crypto.subtle.sign({name:'ECDSA', hash:'SHA-256'}, signer, te.encode(body)));
  const r = await fetch(SYNC_URL + '?action=save&key=' + key, {method:'POST', body: JSON.stringify({body, sig})});
  const j = await r.json(); if(!j.success) throw new Error(j.message || '');
}
async function verifiedLoad(key){
  const d = await rawLoad(key);
  if(!d || typeof d.body !== 'string' || typeof d.sig !== 'string') return null;
  verifier = verifier || await crypto.subtle.importKey('jwk', PUB_JWK, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify']);
  const ok = await crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, verifier, ub64(d.sig), te.encode(d.body));
  return ok ? JSON.parse(d.body) : null;
}

// ===== 新規登録 =====
function storageOK(){ try{ localStorage.setItem('__synctest','1'); localStorage.removeItem('__synctest'); return true; }catch(e){ return false; } }
function saveAddedLocal(){ try{ localStorage.setItem(ADD_KEY, JSON.stringify(added)); return true; }catch(e){ return false; } }
function publicShops(){ return added.shops.map(({rep, ...r}) => r); }

async function pushCloud(noAsk){
  if(noAsk && !storageOK()) return;          // 自動の送り直しはプレビュー等からはしない
  try{
    if(!await ensureSigner(noAsk)) throw new Error('nosign');
    await signedSave(CLOUD_KEY, {savedAt: added.savedAt, shops: publicShops()});
    if(added.pending){ added.pending = false; saveAddedLocal(); }
    if(!noAsk) toast('☁ 公開版にも反映しました');
  }catch(e){
    added.pending = true; saveAddedLocal();
    if(!noAsk) toast('公開版への送信に失敗。次に開いたとき送り直します');
  }
}
function fromCloud(d){                           // クラウドの登録店に、Macだけにある代表者名を戻す
  const reps = Object.fromEntries(added.shops.map(x => [x.no, x.rep || '']));
  return d.shops.map(x => ({...x, added: true, rep: reps[x.no] || ''}));
}
async function loadCloud(){
  try{
    const d = await verifiedLoad(CLOUD_KEY);
    if(!d || !Array.isArray(d.shops)) return;
    if((d.savedAt||0) > (added.savedAt||0)){     // ほかの端末で登録・直した分を取り込む
      added = {savedAt: d.savedAt, shops: fromCloud(d)};
      saveAddedLocal(); rebuild(); render();
    }
  }catch(e){}
}
let addBusy = false;
async function changeAdded(fn){                   // 最新を読んでから変える＝Macとスマホで消し合わない
  if(addBusy) return; addBusy = true;
  try{
    let shops = added.shops;
    try{ const d = await verifiedLoad(CLOUD_KEY); if(d && Array.isArray(d.shops) && (d.savedAt||0) >= (added.savedAt||0)) shops = fromCloud(d); }catch(e){}
    shops = shops.map(x => ({...x}));
    const msg = fn(shops);
    added = {savedAt: Date.now(), shops};
    if(!saveAddedLocal() && CAN_EDIT){ alert('保存できませんでした（Safariの保存場所がいっぱいの可能性）'); return; }
    rebuild(); render(); $('dlg').close(); toast(msg);
    await pushCloud();
  }finally{ addBusy = false; }
}

let editNo = null;
$('cbs').innerHTML = CATS.map(c => `<label><input type="checkbox" name="cat" value="${c}">${ICON[c]} ${c}</label>`).join('');
function openDlg(no){
  const f = $('f'); f.reset(); editNo = no || null;
  const s = no ? added.shops.find(x => x.no === no) : null;
  $('dlgTitle').textContent = s ? `${s.no}番 ${s.name} を直す` : 'お店を新規登録';
  $('okBtn').textContent = s ? '直す' : '登録する';
  $('delBtn').style.display = s ? '' : 'none';
  $('repRow').style.display = CAN_EDIT ? '' : 'none';
  if(s){
    f.shopname.value = s.name; f.rep.value = s.rep||''; f.place.value = s.place||'';
    [0,1].forEach(k => { const it = s.items[k]; if(it){ f['t'+(k+1)].value = it.t; f['q'+(k+1)].value = it.q||''; f['p'+(k+1)].value = it.p||''; } });
    f.querySelectorAll('[name=cat]').forEach(cb => cb.checked = s.cats.includes(cb.value));
  }
  $('dlg').showModal();
}
$('addBtn').onclick = async () => { if(await ensureSigner()){ render(); openDlg(null); } };
$('cancelBtn').onclick = () => $('dlg').close();
$('f').addEventListener('submit', e => {
  e.preventDefault();
  const f = $('f'); const name = f.shopname.value.trim(); if(!name) return;
  const items = [1,2].map(k => {
    const t = f['t'+k].value.trim(); if(!t) return null;
    const it = {t}; const q = parseInt(f['q'+k].value, 10); if(q > 0) it.q = q;
    const pz = f['p'+k].value.trim(); if(pz) it.p = pz; return it;
  }).filter(Boolean);
  const shop = {name, rep: CAN_EDIT ? f.rep.value.trim() : '', cats: [...f.querySelectorAll('[name=cat]:checked')].map(x => x.value), items, added: true};
  const place = f.place.value.trim(); if(place) shop.place = place;
  const no = editNo;
  changeAdded(shops => {
    if(no){ const i = shops.findIndex(x => x.no === no);
      if(i < 0) return 'その店はほかの端末で消されていました';
      if(!CAN_EDIT) shop.rep = shops[i].rep || '';
      shop.no = no; shops[i] = shop; return '直しました'; }
    shop.no = Math.max(...BASE.map(x => x.no), ...shops.map(x => x.no)) + 1; shops.push(shop);
    return `${shop.no}番で登録しました`;
  });
});
$('delBtn').onclick = () => {
  const s = added.shops.find(x => x.no === editNo); if(!s) return;
  if(!confirm(`${s.no}番「${s.name}」を一覧から消しますか？`)) return;
  const no = editNo;
  changeAdded(shops => { const i = shops.findIndex(x => x.no === no); if(i >= 0) shops.splice(i, 1); return '消しました'; });
};
// ===== 売り切れ =====
function saveSoldLocal(){ try{ localStorage.setItem(SOLD_KEY, JSON.stringify(sold)); return true; }catch(e){ return false; } }
async function loadSold(){
  try{
    const d = await verifiedLoad(SOLD_KEY);
    if(!d || typeof d.s !== 'object') return;
    if((d.savedAt||0) > (sold.savedAt||0)){ sold = {savedAt: d.savedAt, s: d.s}; saveSoldLocal(); render(); }
  }catch(e){}
}
async function pushSold(noAsk){
  if(!storageOK()) return;
  try{
    if(!await ensureSigner(noAsk)) throw new Error('nosign');
    await signedSave(SOLD_KEY, {savedAt: sold.savedAt, s: sold.s});
    if(sold.pending){ sold.pending = false; saveSoldLocal(); }
    if(!noAsk) toast('☁ 公開版にも出しました');
  }catch(e){ sold.pending = true; saveSoldLocal(); if(!noAsk) toast('送信に失敗。次に開いたとき送り直します'); }
}
let soldBusy = false;
async function toggleSold(k){
  if(soldBusy) return; soldBusy = true;
  try{
    if(!await ensureSigner()) return;
    let base = sold.s;                               // ほかの端末で付けた分を消さないよう、最新を読んでから足す
    try{ const d = await verifiedLoad(SOLD_KEY); if(d && d.s && (d.savedAt||0) >= sold.savedAt) base = d.s; }catch(e){}
    const s2 = {...base}; if(s2[k]) delete s2[k]; else s2[k] = true;
    sold = {savedAt: Date.now(), s: s2};
    if(!saveSoldLocal() && CAN_EDIT){ alert('保存できませんでした（Safariの保存場所がいっぱいの可能性）'); return; }
    render(); await pushSold();
  }finally{ soldBusy = false; }
}
$('soldBtn').onclick = async () => {
  if(!soldMode && !await ensureSigner()) return;
  soldMode = !soldMode; $('soldBtn').classList.toggle('on', soldMode);
  $('soldBtn').textContent = soldMode ? '売り切れ入力を終わる' : SOLD_LABEL;
  $('soldHint').hidden = !soldMode; render();
};

const SOLD_LABEL = CAN_EDIT ? '売り切れを付ける' : '🔒 売り切れを付ける（お店の人用）';
$('soldBtn').textContent = SOLD_LABEL;
if(!CAN_EDIT){ $('addBtn').textContent = '🔒 お店を新規登録（お店の人用）';
  const ft = document.querySelector('.foot'); ft.appendChild($('soldBtn')); ft.appendChild($('addBtn')); }
setInterval(() => { loadSold(); loadCloud(); }, 60000);   // 1分ごとに、ほかの端末で付けた売り切れ・登録を読み直す
document.addEventListener('visibilitychange', () => { if(!document.hidden){ loadSold(); loadCloud(); } });
countdown(); chips(); render();
if(added.pending && storageOK()) pushCloud(true);
if(sold.pending && storageOK()) pushSold(true);
loadSold();
loadCloud();
</script>
