  .fybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 6px 8px;font-weight:700;color:#5a4a2e;}
  .fybar select{border:1.5px solid #b8862e;border-radius:8px;padding:6px 10px;font-size:14px;font-family:inherit;background:#fffaf0;color:#5a4a2e;font-weight:700;}

  .meta input.op[readonly]{background:#f4f0e6;color:#6a5a3e;}
  #fyCap{font-size:13px;letter-spacing:0;margin-left:10px;color:#6a5a3e;}
  @media print{ .fybar{display:none !important;} }
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:1200;overflow:auto;padding:18px 12px;}
  .modal.show{display:block;}
  .modal .box{background:#fff;max-width:660px;margin:0 auto;border-radius:14px;padding:16px 18px;box-shadow:0 6px 24px rgba(0,0,0,.3);}
  .modal h2{margin:2px 0 10px;font-size:17px;color:var(--head);}
  .modal h3{margin:14px 0 6px;font-size:14px;color:var(--head);}
  .modal table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 8px;min-width:0;}
  .modal th,.modal td{border:1px solid var(--line);padding:6px 8px;text-align:center;}
  .modal th{background:#f6efe0;color:var(--head);}
  .modal td.r{text-align:right;font-variant-numeric:tabular-nums;}
  .modal td.si2{color:var(--shiire);} .modal td.sh2{color:var(--shiharai);}
  .modal tr.ttl td{background:#f6efe0;font-weight:700;}
  .modal .close-x{background:#efe9dc;color:#7a5a36;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:14px;font-weight:600;}
  .hist-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:7px 0;font-size:13px;}
  .hist-item .when{font-weight:700;color:var(--head);}
  .hist-item .info{color:#887;}
  .hist-item button{margin-left:auto;border:none;background:#2f6fb0;color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;}
  @media (max-width:700px){
    td input,.meta input,.filterbar input{font-size:16px;}
    td input{padding:8px 3px;}
    header h1{font-size:15px;}
  }
  @media (pointer:coarse){ .delbtn{padding:9px 0;} .btn{padding:9px 13px;} }
  @media print{ header .tools,.tab.add,.meta .del,.col-del,.addrow,.hint,#copyFab,.filterbar,.modal,#tabsBottom{display:none !important;} td.cell-sel{background:transparent !important;} body{background:#fff;} header{background:#fff;color:#000;box-shadow:none;} .tabs,.meta,.card{box-shadow:none;} table{min-width:0;font-size:10px;} td,th{padding:2px 4px;} }
  /* 月別集計だけを印刷するモード */
  @media print{
    body.print-sum header, body.print-sum .wrap, body.print-sum #histModal{display:none !important;}
    body.print-sum #sumModal{display:block !important;position:static;background:none;padding:0;overflow:visible;}
    body.print-sum #sumModal .box{box-shadow:none;max-width:none;border-radius:0;padding:0;}
    body.print-sum #sumModal .close-x{display:none !important;}

  /* 決算用（税理士さんへ渡す1年分のまとめ） */
  #kessanModal .box{max-width:980px;}
  #kessanModal .kscroll{overflow-x:auto;}
  #kessanModal th,#kessanModal td{white-space:nowrap;}
  #kessanModal table.mx th,#kessanModal table.mx td{white-space:nowrap;padding:5px 6px;}
  #kessanModal .kbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;margin-bottom:4px;}
  #kessanModal select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;}
  #kessanModal .knote{font-size:12px;color:#776;line-height:1.7;background:#fbf6ea;border:1px solid #eadfc6;border-radius:8px;padding:8px 10px;margin-top:10px;}
  @media print{
    body.print-kessan header, body.print-kessan .wrap, body.print-kessan #histModal, body.print-kessan #sumModal{display:none !important;}
    body.print-kessan #kessanModal{display:block !important;position:static;background:none;padding:0;overflow:visible;}
    body.print-kessan #kessanModal .box{box-shadow:none;max-width:none;border-radius:0;padding:0;}
    body.print-kessan #kessanModal .noprint{display:none !important;}
    body.print-kessan #kessanModal table{font-size:10px;}
    body.print-kessan #kessanModal h3{break-after:avoid;}
  }

<script>window.CLOUDLOCK_KEYS=["shiire_data"];</script>
<script>
/* ==== 合言葉カギ（cloudlock v1）==== 焼肉ありもと等の全アプリ共通。
   クラウド(GAS)へ送る時に合言葉で暗号化し、読む時に戻す。アプリ側の fetch はそのまま。
   使い方: アプリの最初の<script>より前に置き、 window.CLOUDLOCK_KEYS=['自分のkey',...] を書く。
   合言葉は全アプリ共通（localStorage 'arimoto_cloud_pass'）。クラウドの 'arimoto_cloud_check' で同じ合言葉か確かめる。 */
(function(){
  const GAS_ID='AKfycbxwL19mAenATUMILRsQYrDL0ThjU2C583Cj729OfzNHEH3drMcZCExYULRp4VGOZ11J';
  const PASS_KEY='arimoto_cloud_pass', CHECK_KEY='arimoto_cloud_check', CHECK_TEXT='arimoto-ok';
  const MY=()=>window.CLOUDLOCK_KEYS||[];
  const rawFetch=window.fetch.bind(window);
  const te=new TextEncoder(), td=new TextDecoder();
  let PASS=null; try{ PASS=localStorage.getItem(PASS_KEY); }catch(e){}
  const b64=u=>{ let s=''; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(s); };
  const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
  const keyCache={};
  async function deriveKey(pass,saltB64){
    const ck=pass+'|'+saltB64; if(keyCache[ck]) return keyCache[ck];
    const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
    return keyCache[ck]=crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  let sessSalt=null;
  async function enc(text,pass){
    sessSalt=sessSalt||b64(crypto.getRandomValues(new Uint8Array(16)));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pass,sessSalt),te.encode(text)));
    return {enc:1,v:1,salt:sessSalt,iv:b64(iv),ct:b64(ct),savedAt:Date.now()};
  }
  async function dec(e,pass){
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},await deriveKey(pass,e.salt),unb64(e.ct));
    return td.decode(pt);
  }
  const isEnc=d=>d&&typeof d==='object'&&d.enc===1&&d.ct;
  const parse=d=>{ if(typeof d==='string'){ try{ return JSON.parse(d); }catch(e){} } return d; };
  const jres=o=>new Response(JSON.stringify(o),{status:200,headers:{'Content-Type':'application/json'}});
  function info(url){ try{ const u=new URL(url,location.href); if(!u.href.includes(GAS_ID)) return null; return {action:u.searchParams.get('action'),key:u.searchParams.get('key')}; }catch(e){ return null; } }
  async function rawLoad(key){ const r=await rawFetch('https://script.google.com/macros/s/'+GAS_ID+'/exec?action=load&key='+encodeURIComponent(key),{cache:'no-store'}); const j=await r.json(); return parse(j&&j.data); }
  async function rawSave(key,obj){ const r=await rawFetch('https://script.google.com/macros/s/'+GAS_ID+'/exec?action=save&key='+encodeURIComponent(key),{method:'POST',body:JSON.stringify(obj)}); return r.json(); }
  let locked=false;   // カギのかかったデータがあるのに合言葉が無い
  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:(input&&input.url)||''; const inf=info(url);
    if(!inf||!window.crypto||!crypto.subtle) return rawFetch(input,init);
    if(inf.action==='save'){
      const mine=MY().includes(inf.key);
      if(!mine) return rawFetch(input,init);
      if(!PASS){
        // まだカギをかけていない（クラウドが平文）なら今まで通り。かかっていたら上書きしない
        let cur=null; try{ cur=await rawLoad(inf.key); }catch(e){ return jres({success:false,message:'通信エラー'}); }
        cloudEnc[inf.key]=isEnc(cur);
        if(isEnc(cur)){ showLock(); return jres({success:false,message:'合言葉が入っていないので保存しません'}); }
        return rawFetch(input,init);
      }
      const body=init&&init.body; const text=typeof body==='string'?body:(body==null?'':String(body));
      const e=await enc(text,PASS);
      return rawFetch(input,Object.assign({},init,{body:JSON.stringify(e)}));
    }
    if(inf.action==='load'){
      const r=await rawFetch(input,init); let j; try{ j=await r.clone().json(); }catch(e){ return r; }
      const d=parse(j&&j.data); cloudEnc[inf.key]=isEnc(d);
      if(!isEnc(d)) return r;
      if(!PASS){ locked=true; showLock(); return jres({success:true,data:null}); }
      try{ const t=await dec(d,PASS); let v; try{ v=JSON.parse(t); }catch(e){ v=t; } return jres(Object.assign({},j,{data:v})); }
      catch(e){ forget(); showLock('bad'); return jres({success:true,data:null}); }
    }
    return rawFetch(input,init);
  };
  // 閉じる瞬間のビーコン送信（家族資産・ハワイ）も暗号化。合言葉が無くカギつきかもしれない時は送らない
  const cloudEnc={};
  if(navigator.sendBeacon){
    const rawBeacon=navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon=function(url,body){
      const inf=info(String(url));
      if(!inf||inf.action!=='save'||!MY().includes(inf.key)||!window.crypto||!crypto.subtle) return rawBeacon(url,body);
      if(!PASS){ return cloudEnc[inf.key]===false ? rawBeacon(url,body) : true; }
      (async()=>{ const text=typeof body==='string'?body:await new Response(body).text();
        rawFetch(url,{method:'POST',body:JSON.stringify(await enc(text,PASS)),keepalive:true}).catch(()=>{}); })();
      return true;
    };
  }
  function forget(){ PASS=null; try{ localStorage.removeItem(PASS_KEY); }catch(e){} }
  // ---- 画面 ----
  const css='.clk-ov{position:fixed;inset:0;background:rgba(40,30,25,.55);z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:-apple-system,"Hiragino Sans",sans-serif}'
   +'.clk-b{background:#fff;color:#2b2420;border-radius:16px;padding:22px 20px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.25)}'
   +'.clk-b h2{margin:0 0 6px;font-size:20px}.clk-b p{font-size:14px;color:#6b5f57;line-height:1.6;margin:6px 0 12px}'
   +'.clk-b input{width:100%;box-sizing:border-box;font-size:19px;padding:11px;border:1px solid #ddd2c6;border-radius:10px;margin-bottom:9px}'
   +'.clk-e{color:#c62828;font-weight:bold;font-size:14px;min-height:1.2em;margin-bottom:6px}.clk-r{display:flex;gap:8px}'
   +'.clk-r button{flex:1;font-size:15px;padding:12px;border-radius:10px;border:1px solid #ddd2c6;background:#fff;cursor:pointer}.clk-r button.p{background:#b5452f;color:#fff;border-color:#b5452f;font-weight:bold}'
   +'@media print{.clk-pill,.clk-ov{display:none!important}}.clk-pill{position:fixed;right:10px;bottom:10px;z-index:2147482000;background:#2f7d4f;color:#fff;font:12px -apple-system,sans-serif;padding:4px 10px;border-radius:999px;opacity:.85;cursor:pointer}';
  let shown=false;
  async function showLock(why){
    if(shown) return; shown=true;
    if(!document.body){ document.addEventListener('DOMContentLoaded',()=>{shown=false;showLock(why);}); return; }
    if(!document.getElementById('clk-css')){ const s=document.createElement('style'); s.id='clk-css'; s.textContent=css; document.head.appendChild(s); }
    const ov=document.createElement('div'); ov.className='clk-ov'; ov.innerHTML='<div class="clk-b"><h2>🔒 確認中...</h2></div>'; document.body.appendChild(ov);
    const box=ov.firstChild; let mode;
    try{ const c=await rawLoad(CHECK_KEY); mode=isEnc(c)?'enter':'set'; }catch(e){ mode='offline'; }
    const close=()=>{ ov.remove(); shown=false; };
    const later=locked?'':'<button data-a="later">あとで</button>';
    if(mode==='enter') box.innerHTML='<h2>🔒 合言葉を入れてください</h2><p>'+(why==='bad'?'<b>合言葉が変わっています。</b>':'')+'このアプリのクラウドのデータにはカギがかかっています。<b>全アプリ共通の合言葉</b>を入れてください（この端末では次から入れなくてOK）。</p><input type="password" id="clk1" placeholder="合言葉" autocomplete="current-password"><div class="clk-e" id="clke"></div><div class="clk-r">'+later+'<button class="p" data-a="ok">開く</button></div>';
    else if(mode==='set') box.innerHTML='<h2>🔑 合言葉を決めてください</h2><p>クラウドのデータにカギをかけます。<b>全アプリ共通</b>の合言葉です（4文字以上）。iPadなどでは最初に1回入れるだけ。<br><b>忘れるとほかの端末で開けなくなるので、紙に書いて保管してください。</b></p><input type="password" id="clk1" placeholder="合言葉" autocomplete="new-password"><input type="password" id="clk2" placeholder="もう一度" autocomplete="new-password"><div class="clk-e" id="clke"></div><div class="clk-r">'+later+'<button class="p" data-a="ok">決める</button></div>';
    else box.innerHTML='<h2>📡 電波がありません</h2><p>クラウドを確認できませんでした。電波のある所でもう一度開いてください。</p><div class="clk-r"><button data-a="later">閉じる</button><button class="p" data-a="retry">もう一度</button></div>';
    const i1=box.querySelector('#clk1'); if(i1) setTimeout(()=>i1.focus(),50);
    box.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.isComposing) box.querySelector('[data-a=ok]')&&box.querySelector('[data-a=ok]').click(); });
    box.addEventListener('click',async ev=>{
      const a=ev.target.dataset&&ev.target.dataset.a; if(!a) return; const err=box.querySelector('#clke');
      if(a==='later') return close();
      if(a==='retry'){ close(); return showLock(why); }
      const p1=box.querySelector('#clk1').value, p2=(box.querySelector('#clk2')||{}).value;
      if(mode==='enter'){
        if(!p1){ err.textContent='合言葉を入れてください'; return; }
        err.textContent='確認中...';
        try{ const c=await rawLoad(CHECK_KEY); if(await dec(c,p1)!==CHECK_TEXT) throw 0; }catch(e){ err.textContent='❌ 合言葉がちがいます'; return; }
        try{ localStorage.setItem(PASS_KEY,p1); }catch(e){} PASS=p1;
        err.textContent='🔓 開きました。読み込み直します...'; await lockMine(); setTimeout(()=>location.reload(),400); return;
      }
      if((p1||'').length<4){ err.textContent='4文字以上にしてください'; return; }
      if(p1!==p2){ err.textContent='2回の入力がちがいます'; return; }
      err.textContent='カギをかけています...';
      try{ await rawSave(CHECK_KEY,await enc(CHECK_TEXT,p1)); }catch(e){ err.textContent='電波を確認してください'; return; }
      try{ localStorage.setItem(PASS_KEY,p1); }catch(e){} PASS=p1;
      await lockMine(); err.textContent='🔑 カギをかけました'; setTimeout(()=>location.reload(),500);
    });
  }
  // このアプリのクラウドのデータがまだ平文なら、その場で暗号化してかけ直す
  async function lockMine(){
    for(const k of MY()){
      try{ const cur=await rawLoad(k); if(cur!=null&&!isEnc(cur)){ await rawSave(k,await enc(typeof cur==='string'?cur:JSON.stringify(cur),PASS)); } }catch(e){}
    }
  }
  window.cloudlock={showLock,lockMine,hasPass:()=>!!PASS,forget};
  // 起動時: 合言葉があれば平文の残りをかけ直し（移行）。無ければ確認して画面を出す
  function start(){
    if(!window.crypto||!crypto.subtle) return;
    let ok=true; try{ localStorage.setItem('__clk','1'); localStorage.removeItem('__clk'); }catch(e){ ok=false; }
    if(!ok) return;   // プレビュー等では何もしない
    if(PASS){ sessSalt=sessSalt||b64(crypto.getRandomValues(new Uint8Array(16))); deriveKey(PASS,sessSalt);   // 閉じる瞬間の保存に間に合うよう先に鍵を作っておく
      lockMine(); const s=document.createElement('div'); s.className='clk-pill'; s.textContent='🔒'; s.title='クラウドは合言葉でカギつき'; if(!document.getElementById('clk-css')){ const c=document.createElement('style'); c.id='clk-css'; c.textContent=css; document.head.appendChild(c); } document.body.appendChild(s); }
    else showLock();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
/* ==== 合言葉カギ ここまで ==== */

</script>
<!--cloudlock:end-->

<script>
const STORAGE_KEY='yakiniku_shiire_v1';
const SYNC_URL='https://script.google.com/macros/s/AKfycbxwL19mAenATUMILRsQYrDL0ThjU2C583Cj729OfzNHEH3drMcZCExYULRp4VGOZ11J/exec';
const SYNC_KEY='shiire_data';

const z2h=s=>String(s==null?'':s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)); // 全角数字→半角
const toNum=v=>{ if(typeof v==='number') return v; const n=parseFloat(z2h(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const fmt=n=>(Math.round(n)||0).toLocaleString('ja-JP');
const blankRow=()=>({y:8,m:'',d:'',hinmei:'',qty:'',price:'',shiire:'',shiharai:'',bal:''});

function defData(){
  const id='minagawa';
  const rows=[
    {y:8,m:4,d:30,hinmei:'バラ他',shiire:324570},{y:8,m:5,d:1,hinmei:'ロース他',shiire:95740},
    {y:8,m:5,d:2,hinmei:'ロース他',shiire:119320},{y:8,m:5,d:2,hinmei:'レバー他',shiire:22960},
    {y:8,m:5,d:6,hinmei:'バラ他',shiire:18840},{y:8,m:5,d:7,hinmei:'センマイ',shiire:2560},
    {y:8,m:5,d:8,hinmei:'ミノ他',shiire:109162},{y:8,m:5,d:9,hinmei:'バラ他',shiire:21240},
    {y:8,m:5,d:12,hinmei:'ミノ他',shiire:37562},{y:8,m:5,d:15,hinmei:'ロース他',shiire:108468},
    {y:8,m:5,d:16,hinmei:'タン',shiire:22720},{y:8,m:5,d:19,hinmei:'地鶏他',shiire:124215},
    {y:8,m:5,d:23,hinmei:'アウト他',shiire:168413},{y:8,m:5,d:'',hinmei:'消費税',shiire:102630},
    {y:8,m:6,d:10,hinmei:'支払',shiharai:1385510},{y:8,m:5,d:26,hinmei:'地鶏他',shiire:75144},
    {y:8,m:5,d:30,hinmei:'ロース他',shiire:101972},{y:8,m:6,d:2,hinmei:'地鶏',shiire:4600}
  ].map(r=>Object.assign(blankRow(),r));
  return { suppliers:[{id,name:'皆川畜産',addr:'東温市南野田386-5'}], cur:id, pages:{[id]:{opening:107110,rows}} };
}
let data;
let migrated=false;
function normalizeData(d){ // 年月日の全角数字を半角に直す（過去データの修復）
  try{ Object.values(d.pages||{}).forEach(p=>{ (p.rows||[]).forEach(r=>{ ['y','m','d'].forEach(k=>{ const v=r[k]; if(typeof v==='string'){ const nv=z2h(v).trim(); if(nv!==v){ r[k]=nv; migrated=true; } } }); }); }); }catch(e){}
  return d;
}
function load(){ try{ const s=localStorage.getItem(STORAGE_KEY); if(s) return normalizeData(JSON.parse(s)); }catch(e){} return defData(); }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); snapshot(); cloudAutoSave(); }

function sup(){ return data.suppliers.find(s=>s.id===data.cur) || data.suppliers[0]; }
function page(){ if(!data.pages[data.cur]) data.pages[data.cur]={opening:0,rows:[blankRow()]}; const p=data.pages[data.cur]; if(!p.rows||!p.rows.length) p.rows=[blankRow()]; return p; }

// その仕入先の今の残高（まだ払っていない額）。表の差引残高の一番下と同じ計算
function endBalOf(p){
  let bal=toNum(p&&p.opening);
  ((p&&p.rows)||[]).forEach(r=>{ const manual=(r.bal!==''&&r.bal!=null); if(manual) bal=toNum(r.bal); else if(!r.memo) bal+=toNum(r.shiire)-toNum(r.shiharai); });
  return bal;
}
function renderTabs(){
  let h='', total=0;
  data.suppliers.forEach(s=>{
    const b=endBalOf(data.pages[s.id]); total+=b;
    h+=`<div class="tab${s.id===data.cur?' active':''}" onclick="switchSup('${s.id}')" title="まだ払っていない残高 ¥${fmt(b)}">${esc(s.name||'(無名)')}<span class="tb${Math.round(b)===0?' zero':''}">¥${fmt(b)}</span></div>`;
  });
  h+=`<div class="tab add" onclick="addSupplier()">＋ 仕入先を追加</div>`;
  h+=`<div class="kaikake" title="全仕入先の差引残高の合計（買掛金）">買掛金の合計 <b>¥${fmt(total)}</b></div>`;
  document.getElementById('tabs').innerHTML=h;
  const b=document.getElementById('tabsBottom'); if(b) b.innerHTML=h;   // 下側にも同じタブ
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  renderTabs();
  const s=sup(), p=page();
  document.getElementById('supName').value=s.name||'';
  document.getElementById('supAddr').value=s.addr||'';
  renderFyBar();
  const v=calcView(p);
  const oi=document.getElementById('opening'); if(document.activeElement!==oi) oi.value=fmt(v.open);
  oi.readOnly=!v.openEditable;
  oi.title=v.openEditable?'':'前の期の終わりの残高から自動で引き継いでいます（直すときは前の期の行を直してください）';
  document.getElementById('openLbl').textContent=v.openEditable?'前回繰越':'前期からの繰越';
  let html='';
  p.rows.forEach((r,i)=>{
    const si=toNum(r.shiire), sh=toNum(r.shiharai); const memo=!!r.memo;
    const manual=(r.bal!==''&&r.bal!=null);
    const bal=v.bals[i];
    const ov=v.ovr[i];   // 新しい期の空行は、その期の年月を見せる（打ち始めたら書き込む）
    const rowCls=[memo?'memo-row':'', (r.hinmei==='支払')?'pay-row':''].filter(Boolean).join(' ');
    html+=`<tr data-i="${i}" class="${rowCls}">
      <td class="col-y" data-c="0"><input value="${ov?ov.y:(r.y??'')}" inputmode="numeric" oninput="upd(${i},'y',this.value)"></td>
      <td class="col-m" data-c="1"><input value="${ov?ov.m:(r.m??'')}" inputmode="numeric" oninput="upd(${i},'m',this.value)"></td>
      <td class="col-d" data-c="2"><input value="${r.d??''}" inputmode="numeric" oninput="upd(${i},'d',this.value)"></td>
      <td class="hinmei" data-c="3"><input value="${esc(r.hinmei)}" oninput="upd(${i},'hinmei',this.value)"></td>
      <td class="num col-qty" data-c="4"><input value="${esc(r.qty)}" inputmode="numeric" oninput="upd(${i},'qty',this.value)"></td>
      <td class="num col-price" data-c="5"><input value="${r.price!==''&&r.price!=null?fmt(toNum(r.price)):''}" inputmode="numeric" oninput="updN(${i},'price',this.value)" onblur="refmt(this)"></td>
      <td class="num shiire col-si${r.autoSi?' auto':''}" data-c="6" title="${r.autoSi?'数量×単価で自動計算（金額を打ち直せば手入力になります）':''}"><input value="${r.shiire!==''&&r.shiire!=null?fmt(si):''}" inputmode="numeric" oninput="updN(${i},'shiire',this.value)" onblur="refmt(this)"></td>
      <td class="num shiharai col-sh" data-c="7"><input value="${r.shiharai!==''&&r.shiharai!=null?fmt(sh):''}" inputmode="numeric" oninput="updN(${i},'shiharai',this.value)" onblur="refmt(this)"></td>
      <td class="bal col-bal${manual?' bal-manual':''}" data-c="8"><input value="${(memo&&!manual)?'':fmt(bal)}" inputmode="numeric" oninput="updBal(${i},this.value)" onblur="refmt(this)"></td>
      <td class="col-del"><button class="delbtn" onclick="delRow(${i})">✕</button></td></tr>`;
  });
  document.getElementById('tbody').innerHTML=html;
  document.getElementById('sumSi').textContent=fmt(v.sumSi);
  document.getElementById('sumSh').textContent=fmt(v.sumSh);
  document.getElementById('endBal').textContent=fmt(v.endBal);
  applyFilter();
}
function liveRecalc(){
  const p=page(), v=calcView(p);
  const trs=document.querySelectorAll('#tbody tr');
  p.rows.forEach((r,i)=>{ const manual=(r.bal!==''&&r.bal!=null); const tr=trs[i]; if(tr){ tr.querySelector('.bal')?.classList.toggle('bal-manual',manual); const b=tr.querySelector('.bal input'); if(b && document.activeElement!==b) b.value=(r.memo&&!manual)?'':fmt(v.bals[i]);} });
  document.getElementById('sumSi').textContent=fmt(v.sumSi);
  document.getElementById('sumSh').textContent=fmt(v.sumSh);
  document.getElementById('endBal').textContent=fmt(v.endBal);
  renderTabs();   // タブの残高・買掛金の合計も更新
}
function upd(i,k,v){ if(k==='y'||k==='m'||k==='d') v=z2h(v).trim(); claimRow(i); page().rows[i][k]=v; if(k==='hinmei'){ const tr=document.querySelector(`#tbody tr[data-i="${i}"]`); if(tr) tr.classList.toggle('pay-row', String(v).trim()==='支払'); } if(k==='qty' && autoShiire(i)) liveRecalc(); save(); }
function updBal(i,v){ claimRow(i); page().rows[i].bal=(String(v).trim()===''?'':toNum(v)); liveRecalc(); save(); }
function updN(i,k,v){
  claimRow(i);
  const r=page().rows[i];
  r[k]=toNum(v);
  if(k==='shiire') r.autoSi = false;   // 手で入れた仕入金額は、あとから自動計算で上書きしない
  if(k==='price') autoShiire(i);
  liveRecalc(); save();
}
// 数量×単価で仕入金額を入れる。仕入金額が空のとき（または前に自動で入れた値のとき）だけ
function autoShiire(i){
  const r=page().rows[i];
  const q=toNum(r.qty), pr=toNum(r.price);
  const empty = r.shiire===''||r.shiire==null||toNum(r.shiire)===0;
  if(!(q>0 && pr>0) || !(empty || r.autoSi)) return false;
  r.shiire=Math.round(q*pr); r.autoSi=true;
  const td=document.querySelector(`#tbody tr[data-i="${i}"] td.col-si`);
  if(td){ td.classList.add('auto'); const inp=td.querySelector('input'); if(inp && document.activeElement!==inp) inp.value=fmt(r.shiire); }
  return true;
}
function refmt(el){ const n=toNum(el.value); el.value=(el.value.trim()==='')?'':fmt(n); }

function isBlankRow(r){ return !String(r.hinmei||'').trim() && !toNum(r.shiire) && !toNum(r.shiharai) && !String(r.d||'').trim(); }
function openPay(){
  const now=new Date();
  document.getElementById('payDate').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const p=page(), months=calcMonthly(p).filter(m=>m.key!=='(月不明)' && m.si>0).slice(-3).reverse();
  const bal=endBalOf(p);
  let h='';
  months.forEach(m=>{ h+=`<button class="paybtn" onclick="payWith(${Math.round(m.si)})">${esc(mLabel(m.key))}分の仕入を払う<b>¥${fmt(m.si)}</b><small>その月に入れた仕入金額の合計（消費税の行も含む）</small></button>`; });
  h+=`<button class="paybtn" onclick="payWith(${Math.round(bal)})">今の残高をぜんぶ払う<b>¥${fmt(bal)}</b><small>差引残高が 0 になります</small></button>`;
  h+=`<button class="paybtn" onclick="payWith(null)">金額を自分で入れる…<small>請求書の金額と違うときなど</small></button>`;
  document.getElementById('payBody').innerHTML=h;
  document.getElementById('payModal').classList.add('show');
}
function payWith(amount){
  if(amount==null){
    const v=prompt('支払った金額（円）を入れてください'); if(v==null) return;
    amount=Math.round(toNum(v)); if(!amount){ toast('金額が入っていません'); return; }
  }
  const dv=document.getElementById('payDate').value; if(!dv){ toast('支払日を入れてください'); return; }
  const [Y,M,D]=dv.split('-').map(Number);
  const p=page();
  const row=Object.assign(blankRow(),{y:Y-2018, m:String(M), d:String(D), hinmei:'支払', shiharai:amount});   // 年は令和（2026年＝8）
  // 最後の空行たちの前に入れる（空行はそのまま下に残す）
  let at=p.rows.length; while(at>0 && isBlankRow(p.rows[at-1])) at--;
  p.rows.splice(at,0,row);
  const pfy=fyOfYM(Y-2018,M); if(viewFy!=='all' && viewFy!==pfy) setViewFy(pfy,true);   // 支払った日の期を表示する
  save(); render();
  document.getElementById('payModal').classList.remove('show');
  const tr=document.querySelector(`#tbody tr[data-i="${at}"]`); if(tr) tr.scrollIntoView({block:'center'});
  toast(`💴 支払 ¥${fmt(amount)} を記録しました`);
}

// ============ 月別集計 ============
function calcMonthly(p){
  let bal=toNum(p.opening); const order=[], map={}; let prev=null;
  (p.rows||[]).forEach(r=>{
    const si=toNum(r.shiire), sh=toNum(r.shiharai), manual=(r.bal!==''&&r.bal!=null);
    if(manual){ bal=toNum(r.bal); } else if(!r.memo){ bal+=si-sh; }
    const empty=!String(r.hinmei||'').trim() && !si && !sh;
    if(empty) return;
    const mm=z2h(String(r.m??'')).replace(/月$/,'').trim(), yy=z2h(String(r.y??'')).trim();
    let k=(mm==='') ? prev : (yy+'-'+mm);
    if(k==null) k='(月不明)';
    prev=k;
    if(!map[k]){ map[k]={si:0,sh:0,bal:bal}; order.push(k); }
    if(!r.memo){ map[k].si+=si; map[k].sh+=sh; }
    map[k].bal=bal;
  });
  return order.map(k=>({key:k, si:map[k].si, sh:map[k].sh, bal:map[k].bal}));
}
function mLabel(k){ if(k==='(月不明)') return k; const a=String(k).split('-'); return (a[0]?('R'+a[0]+'年'):'')+a[1]+'月'; }

    h+='<tr class="ttl"><td>合計</td><td class="r si2">'+fmt(gsi)+'</td><td class="r sh2">'+fmt(gsh)+'</td></tr></table>';

// ============ 決算用まとめ（税理士さんへ渡す1年分） ============
// 決算は9月末締め（10月〜翌9月）。年は令和で持つ（2026年＝8）。期は終わりの年で呼ぶ（R8＝R7年10月〜R8年9月）
// 期首・期末の残高は棚卸アプリの買掛金と同じ計算（その月末までの行を上から順に、手入力の残高はそれに置き換え）
let kessanFy=null;
function rowYMs(p){ let py=0,pm=0; return (p.rows||[]).map(r=>{ const y=Math.round(toNum(r.y))||py, m=Math.round(toNum(r.m))||pm; py=y; pm=m; return {y,m}; }); }
function balAtMonthEnd(p,ty,tm){
  let bal=toNum(p.opening); const ym=rowYMs(p);
  for(let i=0;i<(p.rows||[]).length;i++){ const r=p.rows[i], {y,m}=ym[i];
    if(y>ty || (y===ty && m>tm)) break;
    if(r.bal!==''&&r.bal!=null) bal=toNum(r.bal); else if(!r.memo) bal+=toNum(r.shiire)-toNum(r.shiharai); }
  return Math.round(bal);
}
function fyOfYM(y,m){ return m>=10? y+1 : y; }
function kessanFyList(){
  const set=new Set();
  data.suppliers.forEach(s=>{ const p=data.pages[s.id]; if(!p) return; rowYMs(p).forEach(({y,m},i)=>{ const r=p.rows[i]; if(y>0&&m>0&&(toNum(r.shiire)||toNum(r.shiharai))) set.add(fyOfYM(y,m)); }); });
  return [...set].sort((a,b)=>b-a);
}
function kessanMonths(fy){ const a=[]; for(let k=0;k<12;k++){ const m=(9+k)%12+1; a.push({y:m>=10?fy-1:fy, m}); } return a; }
function kessanCalc(fy){
  const months=kessanMonths(fy), res=[];
  data.suppliers.forEach(s=>{ const p=data.pages[s.id]; if(!p) return;
    const ym=rowYMs(p), mon=months.map(()=>0), rows=[]; let si=0, sh=0, t10=0, t8=0, manual=false;
    (p.rows||[]).forEach((r,i)=>{ const {y,m}=ym[i]; if(fyOfYM(y,m)!==fy || !m) return;
      const a=toNum(r.shiire), b=toNum(r.shiharai);
      if(!String(r.hinmei||'').trim() && !a && !b) return;
      rows.push({r,y,m});
      if(r.bal!==''&&r.bal!=null) manual=true;
      if(r.memo){ const h=z2h(String(r.hinmei||'')); if(/10/.test(h)) t10+=a; else if(/8/.test(h)) t8+=a; return; }
      si+=a; sh+=b; mon[months.findIndex(x=>x.y===y&&x.m===m)]+=a;
    });
    const open=balAtMonthEnd(p,fy-1,9), close=balAtMonthEnd(p,fy,9);
    if(!rows.length && !open && !close) return;
    res.push({id:s.id, seikyu:p.seikyu||{}, name:s.name||'(無名)', open, si, sh, close, mon, t10, t8, manual, rows, diff:Math.round(open+si-sh-close)!==0});
  });
  return {months, res};
}
const fyLabel=fy=>`令和${fy}年9月期（令和${fy-1}年10月〜令和${fy}年9月）`;

// ============ 期の切り替え（表示だけを期ごとに分ける） ============
// データは1本のまま（棚卸・仕入集計表も同じデータを読むため）。残高は前の期から自動で続く
// どの期を見ているかは端末ごとの覚え書き（クラウドには送らない）
const VIEWFY_KEY='yakiniku_shiire_viewfy_v1';
function nowFy(){ const n=new Date(); return fyOfYM(n.getFullYear()-2018, n.getMonth()+1); }
let viewFy=(()=>{ try{ const v=localStorage.getItem(VIEWFY_KEY); if(v==='all') return 'all'; if(v&&+v>0) return +v; }catch(e){} return nowFy(); })();
function fyList(){ const s=new Set(kessanFyList()); s.add(nowFy()); return [...s].sort((a,b)=>b-a); }
function latestFy(){ return fyList()[0]; }
function trailStart(p){ let at=(p.rows||[]).length; while(at>0 && isBlankRow(p.rows[at-1])) at--; return at; }   // 末尾の空行の始まり
// 各行が今の表示に入るか（末尾の空行は最新の期に見せる）
function viewMask(p){
  const rows=p.rows||[];
  if(viewFy==='all') return rows.map(()=>true);
  const ym=rowYMs(p), ts=trailStart(p), last=(viewFy===latestFy());
  return rows.map((r,i)=> i>=ts ? last : fyOfYM(ym[i].y, ym[i].m)===viewFy);
}
// 末尾の空行が前の期の年月のままなら、見ている期の年月にして見せる
function blankYM(fy){ const n=new Date(), y=n.getFullYear()-2018, m=n.getMonth()+1; return fyOfYM(y,m)===fy ? {y, m:String(m)} : {y:fy-1, m:'10'}; }
function rowOverride(p,i,ym,ts){
  if(viewFy==='all' || i<ts) return null;
  const {y,m}=ym[i]; if(m && fyOfYM(y,m)===viewFy) return null;
  return blankYM(viewFy);
}
function claimRow(i){
  const p=page(), ts=trailStart(p); if(i<ts) return;
  const ov=rowOverride(p,i,rowYMs(p),ts); if(!ov) return;
  p.rows[i].y=ov.y; p.rows[i].m=ov.m;
}
// 表の数字：残高は全部の行で通して計算、合計はこの期の行だけ
function calcView(p){
  const rows=p.rows||[], mask=viewMask(p), ym=rowYMs(p), ts=trailStart(p);
  const firstFy=rows.reduce((a,r,i)=> i<ts && ym[i].m ? Math.min(a, fyOfYM(ym[i].y, ym[i].m)) : a, Infinity);
  const openEditable = viewFy==='all' || viewFy<=firstFy;
  const open = openEditable ? toNum(p.opening) : balAtMonthEnd(p, viewFy-1, 9);
  let bal=toNum(p.opening), sumSi=0, sumSh=0, endBal=open; const bals=[], ovr=[];
  rows.forEach((r,i)=>{
    const si=toNum(r.shiire), sh=toNum(r.shiharai), manual=(r.bal!==''&&r.bal!=null);
    if(manual) bal=toNum(r.bal); else if(!r.memo) bal+=si-sh;
    bals.push(bal); ovr.push(rowOverride(p,i,ym,ts));
    if(!mask[i]) return;
    if(!r.memo){ sumSi+=si; sumSh+=sh; }
    endBal=bal;
  });
  return {mask, bals, ovr, open, openEditable, sumSi, sumSh, endBal};
}
function inViewKey(k){
  if(viewFy==='all') return true;
  const a=String(k).split('-'), y=toNum(a[0]), m=toNum(a[1]);
  return !!(y && m) && fyOfYM(y,m)===viewFy;
}
function renderFyBar(){
  const sel=document.getElementById('fySel'); if(!sel) return;
  const list=fyList(), nf=nowFy();
  if(viewFy!=='all' && !list.includes(viewFy)) viewFy=nf;

    + `<option value="all"${viewFy==='all'?' selected':''}>すべての期をまとめて表示</option>`;
  document.getElementById('fyInfo').textContent = viewFy==='all' ? '' : (viewFy===nf ? '残高は前の期から自動で続きます' : '過去の期（新しい行は今の期へ）');
  document.getElementById('fyCap').textContent = viewFy==='all' ? '' : '令和'+viewFy+'年9月期';
}
function setViewFy(v, quiet){
  viewFy = v==='all' ? 'all' : +v;
  try{ localStorage.setItem(VIEWFY_KEY, String(viewFy)); }catch(e){}
  if(quiet) return;
  render(); scrollToLatest();
}
function toLatestForAdd(){
  if(viewFy==='all' || viewFy===latestFy()) return;
  setViewFy(latestFy(), true); toast('今の期の表示に切り替えました');
}
function openKessan(){
  const list=kessanFyList();
  if(!list.length){ toast('まだ仕入のデータがありません'); return; }
  // 初めは「いちばん最近終わった期」。データがそれより古ければ、データのある最新の期
  const now=new Date(), cy=now.getFullYear()-2018, cm=now.getMonth()+1;
  const ended=fyOfYM(cy,cm)-1;
  if(kessanFy==null || !list.includes(kessanFy)) kessanFy = list.includes(ended)? ended : list[0];
  document.getElementById('kessanFy').innerHTML=list.map(fy=>`<option value="${fy}"${fy===kessanFy?' selected':''}>${fyLabel(fy)}</option>`).join('');
  renderKessan();
  document.getElementById('kessanModal').classList.add('show');
}
function renderKessan(){
  const fy=kessanFy, {months,res}=kessanCalc(fy);
  const sum=k=>res.reduce((s,x)=>s+x[k],0);
  let h=`<div style="font-weight:700;color:#5a3a17;margin:2px 0 8px;">${fyLabel(fy)}</div>`;
  // ① 仕入先ごとのまとめ
  h+='<h3>① 仕入先ごとのまとめ</h3><div class="kscroll"><table><tr><th>仕入先</th><th>期首の買掛金<br><small>（R'+(fy-1)+'年9月末）</small></th><th>1年間の仕入</th><th>1年間の支払</th><th>期末の買掛金<br><small>（R'+fy+'年9月末・未払い）</small></th></tr>';
  res.forEach(x=>{ h+=`<tr><td style="text-align:left;">${esc(x.name)}${x.diff?' <span style="color:#c0392b;">※</span>':''}</td><td class="r">${fmt(x.open)}</td><td class="r si2">${fmt(x.si)}</td><td class="r sh2">${fmt(x.sh)}</td><td class="r"><b>${fmt(x.close)}</b></td></tr>`; });
  h+=`<tr class="ttl"><td>合計</td><td class="r">${fmt(sum('open'))}</td><td class="r si2">${fmt(sum('si'))}</td><td class="r sh2">${fmt(sum('sh'))}</td><td class="r">${fmt(sum('close'))}</td></tr></table></div>`;
  if(res.some(x=>x.diff)) h+='<div style="font-size:11px;color:#c0392b;">※ 差引残高を手で入れた行があるため「期首＋仕入−支払」と期末が合いません（期末は帳簿の差引残高のとおり）</div>';
  // ② 月別×仕入先

// ============ Macとスマホの自動同期 ============
// 最後にクラウドとそろえた時点の中身（base）を覚えておき、
//   クラウドだけ変わっていた → クラウドを読み込む（ほかの端末で入れた分）
//   手元だけ変わっていた     → クラウドへ送る
//   両方変わっていた         → どちらを残すか聞く（読み込む前の状態は履歴に残る）
// 以前は、手元が空のときしかクラウドを読まず、編集のたびに手元の内容で上書きしていたため、
// ほかの端末で入れた分が消えることがあった。
// 表示中の仕入先（cur）は比べない（タブを切り替えただけで「変更あり」にしないため）。
const BASE_KEY='yakiniku_shiire_syncbase_v1';
function fpOf(d){ return JSON.stringify({s:d.suppliers||[], p:d.pages||{}}); }
function getBase(){ try{ return localStorage.getItem(BASE_KEY); }catch(e){ return null; } }
function setBase(d){ try{ localStorage.setItem(BASE_KEY, fpOf(d)); }catch(e){} }
let autoCloudTimer=null, syncing=false, cloudReady=false, lastSync=0;
function cloudAutoSave(){ if(!cloudReady) return; clearTimeout(autoCloudTimer); autoCloudTimer=setTimeout(syncNow,2500); }
async function fetchCloud(){
  const res=await fetch(SYNC_URL+'?action=load&key='+SYNC_KEY,{cache:'no-store'}); const j=await res.json();
  let d=j&&j.data; if(typeof d==='string'){ try{ d=JSON.parse(d);}catch(e){ d=null; } }
  return (d&&d.suppliers&&d.pages) ? normalizeData(d) : null;
}
function takeCloud(d, msg){
  snapshot(true);   // 読み込む前の手元の状態を履歴へ
  const cur=data.cur;
  data=d; if(data.suppliers.some(s=>s.id===cur)) data.cur=cur;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  setBase(data);
  render();
  if(msg) toast(msg);
}
async function syncNow(){
  if(syncing) return;
  syncing=true; lastSync=Date.now();
  clearTimeout(autoCloudTimer); autoCloudTimer=null;
  try{
    const cloud=await fetchCloud();
    const hasLocal=localStorage.getItem(STORAGE_KEY)!==null;
    const local=fpOf(data), base=getBase();
    if(!cloud){
      if(hasLocal) await pushCloud(true);                       // クラウドが空なら手元を送る
    }else{
      const cs=fpOf(cloud);
      if(cs===local) setBase(data);                             // 同じ
      else if(!hasLocal) takeCloud(cloud,'☁️ クラウドから読み込みました');   // この端末では初めて
      else{
        if(base===null){ takeCloud(cloud,'☁️ クラウドの内容を読み込みました（前の内容は🕘履歴に残っています）'); syncing=false; cloudReady=true; return; }   // 公開版のみ：この端末で新しい版を初めて開いたときは、クラウドを正とする（古い手元でクラウドを上書きしない）
        const cloudChanged = base===null || cs!==base;
        const localChanged = base===null || local!==base;
        if(cloudChanged && !localChanged) takeCloud(cloud,'☁️ ほかの端末で入れた分を読み込みました');
        else if(!cloudChanged && localChanged) await pushCloud(true);
        else if(confirm('⚠️ この画面とクラウド（ほかの端末）の両方に、違う内容があります。\n\n'
                      + 'OK＝クラウドの内容を読み込む（この画面の内容は履歴に残ります）\n'
                      + 'キャンセル＝この画面の内容でクラウドを上書きする')) takeCloud(cloud,'☁️ クラウドの内容を読み込みました');
        else await pushCloud(true);
      }
    }
  }catch(e){ /* オフライン等。手元には保存済み */ }
  syncing=false; cloudReady=true;
}
async function pushCloud(silent){ if(!silent) toast('☁️ アップロード中...'); try{ const sent=JSON.stringify(data); const res=await fetch(SYNC_URL+'?action=save&key='+SYNC_KEY,{method:'POST',body:sent}); const j=await res.json(); if(j.success){ setBase(JSON.parse(sent)); if(!silent) toast('☁️ クラウドに保存しました'); return true;} if(!silent) toast('エラー: '+(j.message||'')); }catch(e){ if(!silent) toast('通信エラー: '+e.message);} return false; }
async function cloudUpload(){ await pushCloud(false); }
function applyCloud(j){ if(!j||!j.success||!j.data) return false; let d=j.data; if(typeof d==='string'){ try{ d=JSON.parse(d);}catch(e){ return false; } } if(!d||!d.suppliers) return false; snapshot(true); data=normalizeData(d); localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); setBase(data); render(); return true; }
// 画面に戻ってきたときにも同期（スマホで入れた分をすぐ反映）
document.addEventListener('visibilitychange',()=>{

});

  const tdOf = el => el ? el.closest('td[data-c]') : null;
  const rcOf = td => { if(!td) return null; const tr=td.closest('tr'); if(!tr) return null; return { r:+tr.getAttribute('data-i'), c:+td.getAttribute('data-c') }; };
  const cellEl = (r,c) => tbody.querySelector('tr[data-i="'+r+'"] td[data-c="'+c+'"]');
  const cellFromPoint = (x,y) => tdOf(document.elementFromPoint(x,y));

  function clearSel(){ tbody.querySelectorAll('td.cell-sel').forEach(td=>td.classList.remove('cell-sel')); hasSel=false; fab.classList.remove('show'); document.body.classList.remove('selmode'); }
  function range(){ if(!anchor||!focusCell) return null; return { r1:Math.min(anchor.r,focusCell.r), r2:Math.max(anchor.r,focusCell.r), c1:Math.min(anchor.c,focusCell.c), c2:Math.max(anchor.c,focusCell.c) }; }
  function paint(){
    tbody.querySelectorAll('td.cell-sel').forEach(td=>td.classList.remove('cell-sel'));
    const g=range(); if(!g) return; let n=0;
    for(let r=g.r1;r<=g.r2;r++) for(let c=g.c1;c<=g.c2;c++){ const td=cellEl(r,c); if(td){ td.classList.add('cell-sel'); n++; } }
    hasSel = n>0;
    fab.classList.toggle('show', n>0);
  }
  function buildTSV(){
    const g=range(); if(!g) return '';
    const lines=[];
    for(let r=g.r1;r<=g.r2;r++){ const cells=[]; for(let c=g.c1;c<=g.c2;c++){ const td=cellEl(r,c); const inp=td&&td.querySelector('input'); cells.push(inp?inp.value:''); } lines.push(cells.join('\t')); }
    return lines.join('\n');
  }
  async function doCopy(){
    const tsv=buildTSV(); if(!tsv) return;
    try{ await navigator.clipboard.writeText(tsv); }
    catch(e){ const ta=document.createElement('textarea'); ta.value=tsv; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); }
    toast('📋 コピーしました（'+tsv.split('\n').length+'行）');
  }
  function startSel(rc){ anchor=rc; focusCell=rc; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); document.body.classList.add('selmode'); paint(); }

  tbody.addEventListener('pointerdown', e=>{
    const td=tdOf(e.target); if(!td) return; const rc=rcOf(td); if(!rc) return;
    if(e.shiftKey && anchor){ focusCell=rc; paint(); e.preventDefault(); return; }
    if(e.pointerType==='mouse'){
      mouseDown=true; dragging=false; moved=false; startXY={x:e.clientX,y:e.clientY};
      anchor=rc; focusCell=rc; clearSel();   // クリックは編集、ドラッグで選択
    }else{
      // タッチ：長押しで範囲選択を開始（短いタップは通常編集／スクロール可）
      startXY={x:e.clientX,y:e.clientY}; moved=false;
      lpTimer=setTimeout(()=>{ lpTimer=null; dragging=true; startSel(rc); toast('範囲選択モード：指でなぞって広げてください'); }, 420);
    }
  });

  tbody.addEventListener('pointermove', e=>{
    if(e.pointerType==='mouse'){
      if(!mouseDown) return;
      if(!dragging){ if(startXY && Math.hypot(e.clientX-startXY.x,e.clientY-startXY.y)<5) return; const td0=cellFromPoint(e.clientX,e.clientY); const rc0=rcOf(td0); if(rc0 && (rc0.r!==anchor.r||rc0.c!==anchor.c)){ dragging=true; if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); document.body.classList.add('selmode'); } else return; }
      const td=cellFromPoint(e.clientX,e.clientY); const rc=rcOf(td); if(rc){ focusCell=rc; paint(); } e.preventDefault();
    }else{
      if(lpTimer){ if(startXY && Math.hypot(e.clientX-startXY.x,e.clientY-startXY.y)>8){ clearTimeout(lpTimer); lpTimer=null; } } // 動いたら長押し扱いにせずスクロール優先
      if(dragging){ const td=cellFromPoint(e.clientX,e.clientY); const rc=rcOf(td); if(rc){ focusCell=rc; paint(); } e.preventDefault(); }
    }
  }, {passive:false});

  document.addEventListener('pointerup', ()=>{ mouseDown=false; dragging=false; if(lpTimer){ clearTimeout(lpTimer); lpTimer=null; } });

  // 直近に触れたセル（貼り付け開始位置）を記録
  let activeCell=null;
  tbody.addEventListener('focusin', e=>{ const td=tdOf(e.target); if(td){ activeCell=rcOf(td); } });

  const COLKEY=['y','m','d','hinmei','qty','price','shiire','shiharai','bal'];
  function pasteStart(){
    if(hasSel){ const g=range(); if(g) return { r:g.r1, c:g.c1 }; }
    if(document.activeElement){ const td=tdOf(document.activeElement); if(td) return rcOf(td); }
    return activeCell;
  }
  function applyPaste(start, text){
    if(!start || text==null) return;
    const matrix = text.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(line=>line.split('\t'));
    if(!matrix.length) return;
    const p=page();
    for(let dr=0; dr<matrix.length; dr++){
      const tr=start.r+dr;
      while(p.rows.length<=tr) p.rows.push(blankRow());
      const row=p.rows[tr];
      const cols=matrix[dr];
      for(let dc=0; dc<cols.length; dc++){
        const c=start.c+dc; if(c<0||c>8) continue;
        const key=COLKEY[c];
        if(key==='bal') continue;                 // 差引残高は自動計算を優先（上書きしない）
        let v=cols[dc];
        if(key==='price'||key==='shiire'||key==='shiharai'){ row[key]=(String(v).trim()==='')?'':toNum(v); }
        else { row[key]=v; }
      }
    }
    save(); render();
    toast('📋 貼り付けました（'+matrix.length+'行）');
  }

  // 入力欄にフォーカスがある状態での Command+V（クリップボードを直接取得）
  document.addEventListener('paste', e=>{
    const start=pasteStart(); if(!start) return;
    const text=(e.clipboardData||window.clipboardData)?.getData('text/plain');
    if(text && text.indexOf('\t')<0 && text.indexOf('\n')<0) return; // 単一値はふつうの貼り付けに任せる
    if(text){ e.preventDefault(); applyPaste(start, text); }
  });

  document.addEventListener('keydown', async e=>{
    if((e.metaKey||e.ctrlKey) && (e.key==='c'||e.key==='C')){ if(hasSel){ e.preventDefault(); doCopy(); } }
    else if((e.metaKey||e.ctrlKey) && (e.key==='v'||e.key==='V')){
      // フォーカスが無い等で paste イベントが出ない場合の保険
      const focusedInput = document.activeElement && document.activeElement.tagName==='INPUT';
      if(!focusedInput){ const start=pasteStart(); if(start){ e.preventDefault(); try{ const t=await navigator.clipboard.readText(); if(t) applyPaste(start,t); }catch(_){ toast('貼り付け先のセルをタップしてから Command+V してください'); } } }
    }
    else if(e.key==='Escape'){ clearSel(); document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show')); }
  });

  fab.addEventListener('click', doCopy);
})();
</script>
</body>
</html>
