<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐮 焼肉ありもと｜現金出納帳</title>
<style>
  :root{
    --gold:#c89b3c; --gold-d:#a87f2a; --brown:#7a4a2b; --bg:#f3efe7; --card:#fff;
    --line:#d8cfbf; --txt:#2b2520; --in:#1a7a3a; --out:#c0392b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
    background:var(--bg); color:var(--txt); -webkit-text-size-adjust:100%;
  }
  header{
    background:linear-gradient(135deg,#8a5a36,#b07b3f); color:#fff; padding:10px 14px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header h1{font-size:18px; margin:0; white-space:nowrap;}
  header h1 small{font-weight:500; font-size:12px; opacity:.85;}
  .tools{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;}
  .btn{
    border:none; border-radius:8px; padding:7px 12px; cursor:pointer; font-size:13px;
    background:rgba(255,255,255,.18); color:#fff; font-weight:600;
  }
  .btn:hover{background:rgba(255,255,255,.3);}
  .btn.gold{background:#f2c14e; color:#5a3a17;}
  .btn.cl1{background:#3a8a4a;} .btn.cl2{background:#2f6fb0;}

  .wrap{max-width:1100px; margin:0 auto; padding:12px;}
  .topcard{
    background:var(--card); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08);
    padding:12px 14px; margin-bottom:12px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .monthnav{display:flex; align-items:center; gap:8px;}
  .monthnav button{border:none; background:#eee3cf; width:34px; height:34px; border-radius:8px; font-size:16px; cursor:pointer;}
  .monthnav button:hover{background:#e3d4b8;}
  .monthnav .lbl{font-size:18px; font-weight:700; min-width:130px; text-align:center;}
  .opening{display:flex; align-items:center; gap:8px; margin-left:auto; font-size:14px;}
  .opening input{
    width:130px; text-align:right; font-size:16px; padding:6px 10px; border:1px solid var(--line);
    border-radius:8px; font-variant-numeric:tabular-nums;
  }

  .tablecard{background:var(--card); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); padding:8px;}
  .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{border-collapse:collapse; width:100%; min-width:760px; font-size:13px;}
  th,td{border:1px solid var(--line); padding:0; text-align:center;}
  thead th{background:#f6efe0; color:#6b4a26; font-weight:700; padding:6px 4px; position:sticky; top:0;}
  caption{font-size:20px; font-weight:700; letter-spacing:.4em; padding:8px 0 10px; color:#5a3a17;}
  td input, td select{
    width:100%; border:none; background:transparent; font-size:13px; padding:6px 4px; text-align:center;
    font-family:inherit; color:var(--txt);
  }
  td input:focus, td select:focus{outline:2px solid #f2c14e; outline-offset:-2px; background:#fffdf5;}
  td.num input{text-align:right; font-variant-numeric:tabular-nums; padding-right:6px;}
  td.tekiyo input{text-align:left; padding-left:6px;}
  td.bal{text-align:right; padding-right:8px; font-variant-numeric:tabular-nums; background:#faf7f0; font-weight:600;}
  td.in input{color:var(--in);} td.out input{color:var(--out);}
  .col-y,.col-m,.col-d{width:38px;} .col-tax{width:66px;} .col-inv{width:52px;}
  .col-kamoku{width:120px;} .col-in,.col-out,.col-bal{width:92px;} .col-del{width:30px;}
  .delbtn{border:none; background:none; color:#c0392b; cursor:pointer; font-size:15px; width:100%; padding:6px 0;}
  .delbtn:hover{background:#fbeaea;}
  .invchk{transform:scale(1.25); cursor:pointer; width:auto;}
  tr.teikyu td{background:#f3f0ea; color:#999;}
  tfoot td{background:#f6efe0; font-weight:700; padding:8px 4px; font-variant-numeric:tabular-nums;}
  tfoot .lbl{text-align:right; padding-right:8px; color:#6b4a26;}
  tfoot .in{color:var(--in);} tfoot .out{color:var(--out);}

  .addrow{margin-top:10px; text-align:center;}
  .addrow button{
    border:1px dashed #c2a86a; background:#fbf6ea; color:#8a5a2a; border-radius:8px;
    padding:8px 18px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .addrow button:hover{background:#f5ecd6;}
  .hint{font-size:12px; color:#998; margin:10px 2px; text-align:center;}

  #toast{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,0,.85); color:#fff; padding:12px 20px; border-radius:10px;
    font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:1000;
  }
  #toast.show{opacity:1;}

  @media (max-width:600px){
    header h1{font-size:15px;}
    .btn{padding:8px 10px; font-size:12px;}
    .wrap{padding:8px;}
    .opening{margin-left:0; width:100%;}
    .opening input{flex:1; width:auto;}
  }
  @media print{
    header .tools, .monthnav button, .col-del, .addrow, .hint{display:none !important;}
    body{background:#fff;} header{background:#fff; color:#000; box-shadow:none;}
    .topcard,.tablecard{box-shadow:none;}
    table{min-width:0; font-size:11px;}
  }
</style>
<!--cloudlock:start-->
<script>window.CLOUDLOCK_KEYS=["genkin_suitou_data"];</script>
<script>
/* ==== 合言葉カギ（cloudlock v1）==== 焼肉ありもと等の全アプリ共通。
   クラウド(GAS)へ送る時に合言葉で暗号化し、読む時に戻す。アプリ側の fetch はそのまま。
   使い方: アプリの最初の<script>より前に置き、 window.CLOUDLOCK_KEYS=['自分のkey',...] を書く。
   合言葉は全アプリ共通（localStorage 'arimoto_cloud_pass'）。クラウドの 'arimoto_cloud_check' で同じ合言葉か確かめる。 */
(function(){
  const GAS_ID='AKfycbxwL19mAenATUMILRsQYrDL0ThjU2C583Cj729OfzNHEH3drMcZCExYULRp4VGOZ11J';
  const PASS_KEY='arimoto_cloud_pass', CHECK_KEY='arimoto_cloud_check', CHECK_TEXT='arimoto-ok';
  const MY=()=>window.CLOUDLOCK_KEYS||[];
  const rawFetch=window.fetch.bind(window);
  const te=new TextEncoder(), td=new TextDecoder();
  let PASS=null; try{ PASS=localStorage.getItem(PASS_KEY); }catch(e){}
  const b64=u=>{ let s=''; for(let i=0;i<u.length;i+=8192) s+=String.fromCharCode.apply(null,u.subarray(i,i+8192)); return btoa(s); };
  const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
  const keyCache={};
  async function deriveKey(pass,saltB64){
    const ck=pass+'|'+saltB64; if(keyCache[ck]) return keyCache[ck];
    const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
    return keyCache[ck]=crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(saltB64),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  }
  let sessSalt=null;
  async function enc(text,pass){
    sessSalt=sessSalt||b64(crypto.getRandomValues(new Uint8Array(16)));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pass,sessSalt),te.encode(text)));
    return {enc:1,v:1,salt:sessSalt,iv:b64(iv),ct:b64(ct),savedAt:Date.now()};
  }
  async function dec(e,pass){
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.iv)},await deriveKey(pass,e.salt),unb64(e.ct));
    return td.decode(pt);
  }
  const isEnc=d=>d&&typeof d==='object'&&d.enc===1&&d.ct;
  const parse=d=>{ if(typeof d==='string'){ try{ return JSON.parse(d); }catch(e){} } return d; };
  const jres=o=>new Response(JSON.stringify(o),{status:200,headers:{'Content-Type':'application/json'}});
  function info(url){ try{ const u=new URL(url,location.href); if(!u.href.includes(GAS_ID)) return null; return {action:u.searchParams.get('action'),key:u.searchParams.get('key')}; }catch(e){ return null; } }
  async function rawLoad(key){ const r=await rawFetch('https://script.google.com/macros/s/'+GAS_ID+'/exec?action=load&key='+encodeURIComponent(key),{cache:'no-store'}); const j=await r.json(); return parse(j&&j.data); }
  async function rawSave(key,obj){ const r=await rawFetch('https://script.google.com/macros/s/'+GAS_ID+'/exec?action=save&key='+encodeURIComponent(key),{method:'POST',body:JSON.stringify(obj)}); return r.json(); }
  let locked=false;   // カギのかかったデータがあるのに合言葉が無い
  window.fetch=async function(input,init){
    const url=typeof input==='string'?input:(input&&input.url)||''; const inf=info(url);
    if(!inf||!window.crypto||!crypto.subtle) return rawFetch(input,init);
    if(inf.action==='save'){
      const mine=MY().includes(inf.key);
      if(!mine) return rawFetch(input,init);
      if(!PASS){
        // まだカギをかけていない（クラウドが平文）なら今まで通り。かかっていたら上書きしない
        let cur=null; try{ cur=await rawLoad(inf.key); }catch(e){ return jres({success:false,message:'通信エラー'}); }
        cloudEnc[inf.key]=isEnc(cur);
        if(isEnc(cur)){ showLock(); return jres({success:false,message:'合言葉が入っていないので保存しません'}); }
        return rawFetch(input,init);
      }
      const body=init&&init.body; const text=typeof body==='string'?body:(body==null?'':String(body));
      const e=await enc(text,PASS);
      return rawFetch(input,Object.assign({},init,{body:JSON.stringify(e)}));
    }
    if(inf.action==='load'){
      const r=await rawFetch(input,init); let j; try{ j=await r.clone().json(); }catch(e){ return r; }
      const d=parse(j&&j.data); cloudEnc[inf.key]=isEnc(d);
      if(!isEnc(d)) return r;
      if(!PASS){ locked=true; showLock(); return jres({success:true,data:null}); }
      try{ const t=await dec(d,PASS); let v; try{ v=JSON.parse(t); }catch(e){ v=t; } return jres(Object.assign({},j,{data:v})); }
      catch(e){ forget(); showLock('bad'); return jres({success:true,data:null}); }
    }
    return rawFetch(input,init);
  };
  // 閉じる瞬間のビーコン送信（家族資産・ハワイ）も暗号化。合言葉が無くカギつきかもしれない時は送らない
  const cloudEnc={};
  if(navigator.sendBeacon){
    const rawBeacon=navigator.sendBeacon.bind(navigator);
    navigator.sendBeacon=function(url,body){
      const inf=info(String(url));
      if(!inf||inf.action!=='save'||!MY().includes(inf.key)||!window.crypto||!crypto.subtle) return rawBeacon(url,body);
      if(!PASS){ return cloudEnc[inf.key]===false ? rawBeacon(url,body) : true; }
      (async()=>{ const text=typeof body==='string'?body:await new Response(body).text();
        rawFetch(url,{method:'POST',body:JSON.stringify(await enc(text,PASS)),keepalive:true}).catch(()=>{}); })();
      return true;
    };
  }
  function forget(){ PASS=null; try{ localStorage.removeItem(PASS_KEY); }catch(e){} }
  // ---- 画面 ----
  const css='.clk-ov{position:fixed;inset:0;background:rgba(40,30,25,.55);z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;font-family:-apple-system,"Hiragino Sans",sans-serif}'
   +'.clk-b{background:#fff;color:#2b2420;border-radius:16px;padding:22px 20px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.25)}'
   +'.clk-b h2{margin:0 0 6px;font-size:20px}.clk-b p{font-size:14px;color:#6b5f57;line-height:1.6;margin:6px 0 12px}'
   +'.clk-b input{width:100%;box-sizing:border-box;font-size:19px;padding:11px;border:1px solid #ddd2c6;border-radius:10px;margin-bottom:9px}'
   +'.clk-e{color:#c62828;font-weight:bold;font-size:14px;min-height:1.2em;margin-bottom:6px}.clk-r{display:flex;gap:8px}'
   +'.clk-r button{flex:1;font-size:15px;padding:12px;border-radius:10px;border:1px solid #ddd2c6;background:#fff;cursor:pointer}.clk-r button.p{background:#b5452f;color:#fff;border-color:#b5452f;font-weight:bold}'
   +'@media print{.clk-pill,.clk-ov{display:none!important}}.clk-pill{position:fixed;right:10px;bottom:10px;z-index:2147482000;background:#2f7d4f;color:#fff;font:12px -apple-system,sans-serif;padding:4px 10px;border-radius:999px;opacity:.85;cursor:pointer}';
  let shown=false;
  async function showLock(why){
    if(shown) return; shown=true;
    if(!document.body){ document.addEventListener('DOMContentLoaded',()=>{shown=false;showLock(why);}); return; }
    if(!document.getElementById('clk-css')){ const s=document.createElement('style'); s.id='clk-css'; s.textContent=css; document.head.appendChild(s); }
    const ov=document.createElement('div'); ov.className='clk-ov'; ov.innerHTML='<div class="clk-b"><h2>🔒 確認中...</h2></div>'; document.body.appendChild(ov);
    const box=ov.firstChild; let mode;
    try{ const c=await rawLoad(CHECK_KEY); mode=isEnc(c)?'enter':'set'; }catch(e){ mode='offline'; }
    const close=()=>{ ov.remove(); shown=false; };
    const later=locked?'':'<button data-a="later">あとで</button>';
    if(mode==='enter') box.innerHTML='<h2>🔒 合言葉を入れてください</h2><p>'+(why==='bad'?'<b>合言葉が変わっています。</b>':'')+'このアプリのクラウドのデータにはカギがかかっています。<b>全アプリ共通の合言葉</b>を入れてください（この端末では次から入れなくてOK）。</p><input type="password" id="clk1" placeholder="合言葉" autocomplete="current-password"><div class="clk-e" id="clke"></div><div class="clk-r">'+later+'<button class="p" data-a="ok">開く</button></div>';
    else if(mode==='set') box.innerHTML='<h2>🔑 合言葉を決めてください</h2><p>クラウドのデータにカギをかけます。<b>全アプリ共通</b>の合言葉です（4文字以上）。iPadなどでは最初に1回入れるだけ。<br><b>忘れるとほかの端末で開けなくなるので、紙に書いて保管してください。</b></p><input type="password" id="clk1" placeholder="合言葉" autocomplete="new-password"><input type="password" id="clk2" placeholder="もう一度" autocomplete="new-password"><div class="clk-e" id="clke"></div><div class="clk-r">'+later+'<button class="p" data-a="ok">決める</button></div>';
    else box.innerHTML='<h2>📡 電波がありません</h2><p>クラウドを確認できませんでした。電波のある所でもう一度開いてください。</p><div class="clk-r"><button data-a="later">閉じる</button><button class="p" data-a="retry">もう一度</button></div>';
    const i1=box.querySelector('#clk1'); if(i1) setTimeout(()=>i1.focus(),50);
    box.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.isComposing) box.querySelector('[data-a=ok]')&&box.querySelector('[data-a=ok]').click(); });
    box.addEventListener('click',async ev=>{
      const a=ev.target.dataset&&ev.target.dataset.a; if(!a) return; const err=box.querySelector('#clke');
      if(a==='later') return close();
      if(a==='retry'){ close(); return showLock(why); }
      const p1=box.querySelector('#clk1').value, p2=(box.querySelector('#clk2')||{}).value;
      if(mode==='enter'){
        if(!p1){ err.textContent='合言葉を入れてください'; return; }
        err.textContent='確認中...';
        try{ const c=await rawLoad(CHECK_KEY); if(await dec(c,p1)!==CHECK_TEXT) throw 0; }catch(e){ err.textContent='❌ 合言葉がちがいます'; return; }
        try{ localStorage.setItem(PASS_KEY,p1); }catch(e){} PASS=p1;
        err.textContent='🔓 開きました。読み込み直します...'; await lockMine(); setTimeout(()=>location.reload(),400); return;
      }
      if((p1||'').length<4){ err.textContent='4文字以上にしてください'; return; }
      if(p1!==p2){ err.textContent='2回の入力がちがいます'; return; }
      err.textContent='カギをかけています...';
      try{ await rawSave(CHECK_KEY,await enc(CHECK_TEXT,p1)); }catch(e){ err.textContent='電波を確認してください'; return; }
      try{ localStorage.setItem(PASS_KEY,p1); }catch(e){} PASS=p1;
      await lockMine(); err.textContent='🔑 カギをかけました'; setTimeout(()=>location.reload(),500);
    });
  }
  // このアプリのクラウドのデータがまだ平文なら、その場で暗号化してかけ直す
  async function lockMine(){
    for(const k of MY()){
      try{ const cur=await rawLoad(k); if(cur!=null&&!isEnc(cur)){ await rawSave(k,await enc(typeof cur==='string'?cur:JSON.stringify(cur),PASS)); } }catch(e){}
    }
  }
  window.cloudlock={showLock,lockMine,hasPass:()=>!!PASS,forget};
  // 起動時: 合言葉があれば平文の残りをかけ直し（移行）。無ければ確認して画面を出す
  function start(){
    if(!window.crypto||!crypto.subtle) return;
    let ok=true; try{ localStorage.setItem('__clk','1'); localStorage.removeItem('__clk'); }catch(e){ ok=false; }
    if(!ok) return;   // プレビュー等では何もしない
    if(PASS){ sessSalt=sessSalt||b64(crypto.getRandomValues(new Uint8Array(16))); deriveKey(PASS,sessSalt);   // 閉じる瞬間の保存に間に合うよう先に鍵を作っておく
      lockMine(); const s=document.createElement('div'); s.className='clk-pill'; s.textContent='🔒'; s.title='クラウドは合言葉でカギつき'; if(!document.getElementById('clk-css')){ const c=document.createElement('style'); c.id='clk-css'; c.textContent=css; document.head.appendChild(c); } document.body.appendChild(s); }
    else showLock();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else start();
})();
/* ==== 合言葉カギ ここまで ==== */

</script>
<!--cloudlock:end-->

<script>

const STORAGE_KEY = 'yakiniku_kinsen_v1';
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbxwL19mAenATUMILRsQYrDL0ThjU2C583Cj729OfzNHEH3drMcZCExYULRp4VGOZ11J/exec';
const SYNC_KEY = 'genkin_suitou_data';

let allData = {};
const now = new Date();
let curYear = now.getFullYear() - 2018;   // 令和
let curMonth = now.getMonth() + 1;

const pageKey = () => `R${curYear}-${curMonth}`;
const toNum = s => { if(typeof s==='number') return s; const n = parseFloat(String(s).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
const fmt = n => (n||0).toLocaleString('ja-JP');
const blankRow = () => ({ y:curYear, m:curMonth, d:'', kamoku:'', tekiyo:'', tax:'', invoice:false, nyu:'', shu:'' });

function page(){
  if(!allData[pageKey()]) allData[pageKey()] = { opening:null, rows:[ blankRow() ] };
  const p = allData[pageKey()];
  if(p.opening == null){
    // 前月末残高を前の月の末残高から自動引き継ぎ
    const py = curMonth===1 ? curYear-1 : curYear;
    const pm = curMonth===1 ? 12 : curMonth-1;
    const prev = allData[`R${py}-${pm}`];
    p.opening = prev ? endBalanceOf(prev) : 0;
  }
  if(!p.rows || !p.rows.length) p.rows = [ blankRow() ];
  return p;
}
function endBalanceOf(p){
  let b = toNum(p.opening||0);
  (p.rows||[]).forEach(r => b += toNum(r.nyu) - toNum(r.shu));
  return b;
}

// ============================================================
// 保存・クラウド
// ============================================================
function persist(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); cloudAutoSave(); }
function loadStorage(){ try{ const r=localStorage.getItem(STORAGE_KEY); if(r) allData=JSON.parse(r); }catch(e){ allData={}; } }

// ============================================================
// Macとスマホの自動同期
// 最後にクラウドとそろえた時点の中身（base）を覚えておき、
//   クラウドだけ変わっていた → 読み込む（ほかの端末で入れた分・スプレッドシートからの取り込み）
//   手元だけ変わっていた     → クラウドへ送る
//   両方変わっていた         → どちらを残すか聞く（読み込む前の手元は履歴に残す）
// 以前は手元が空のときしか読み込まず、入力のたびに手元の内容でクラウドを上書きしていたため、
// ほかの端末で入れた分が消えることがあった。
// ============================================================
const BASE_KEY = 'yakiniku_kinsen_syncbase_v1';
const HIST_KEY = 'yakiniku_kinsen_hist_v1';
// 比べるための「中身」。空欄の表し方（'' / null / 0 / キー無し）の違いや、
// 月を見ただけで作られる空のページは無視する（それだけで「変更あり」にしないため）
function fpOf(d){
  const rowHas = r => r && (String(r.d??'').trim() || String(r.kamoku||'').trim() || String(r.tekiyo||'').trim() || toNum(r.nyu) || toNum(r.shu));
  const out = [];
  Object.keys(d||{}).filter(k=>/^R\d+-\d+$/.test(k)).sort().forEach(k=>{
    const p = d[k]||{}; const rows = (p.rows||[]).filter(rowHas);
    if(!rows.length) return;
    out.push([k, toNum(p.opening??0), rows.map(r=>[String(r.y??''),String(r.m??''),String(r.d??'').trim(),r.kamoku||'',r.tekiyo||'',String(r.tax||''),r.invoice?1:0,toNum(r.nyu),toNum(r.shu)])]);
  });
  return JSON.stringify(out);
}
function getBase(){ try{ return localStorage.getItem(BASE_KEY); }catch(e){ return null; } }
function setBase(d){ try{ localStorage.setItem(BASE_KEY, fpOf(d)); }catch(e){} }
// 読み込む前の手元を残す（データが大きいので3世代まで。容量が足りなければ古いものから捨てる）
function snapshot(){
  try{
    const s = localStorage.getItem(STORAGE_KEY); if(!s) return;
    let h=[]; try{ h=JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){}
    if(h.length && h[0].d===s) return;
    h.unshift({t:Date.now(), d:s}); h=h.slice(0,3);
    while(h.length){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h)); return; }catch(e){ h.pop(); } }
  }catch(e){}
}
function histList(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ return []; } }
function openHist(){
  const h = histList();
  if(!h.length){ alert('まだ履歴はありません。\n（ほかの端末の内容を読み込むとき、読み込む前の状態が自動で残ります）'); return; }
  const lines = h.map((e,i)=>`${i+1}. ${new Date(e.t).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} の状態`).join('\n');
  const v = prompt('どの時点に戻しますか？ 番号を入れてください。\n（読み込む前に残した状態です。今の内容も履歴に残ります）\n\n'+lines);
  const i = parseInt(v,10)-1; const e = h[i]; if(!e) return;
  snapshot();
  allData = JSON.parse(e.d); localStorage.setItem(STORAGE_KEY, e.d);
  render(); cloudAutoSave(); toast('🕘 戻しました');
}

var autoCloudTimer=null, syncing=false, cloudReady=false, lastSync=0;
function cloudAutoSave(){ if(!cloudReady) return; clearTimeout(autoCloudTimer); autoCloudTimer=setTimeout(syncNow,2500); }
async function fetchCloud(){
  const res=await fetch(SYNC_URL+'?action=load&key='+SYNC_KEY,{cache:'no-store'});
  const j=await res.json();
  let d=j&&j.data; if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){ d=null; } }
  return (d&&typeof d==='object'&&Object.keys(d).length) ? d : null;
}
function takeCloud(d,msg){
  snapshot();
  allData=d; localStorage.setItem(STORAGE_KEY, JSON.stringify(allData));
  setBase(allData); render();
  if(msg) toast(msg);
}
async function syncNow(){
  if(syncing) return;
  syncing=true; lastSync=Date.now();
  clearTimeout(autoCloudTimer); autoCloudTimer=null;
  try{
    const cloud=await fetchCloud();
    const hasLocal=localStorage.getItem(STORAGE_KEY)!==null;
    const local=fpOf(allData), base=getBase();
    if(!cloud){
      if(hasLocal && local!=='[]') await pushCloud(true);            // クラウドが空なら手元を送る
    }else{
      const cs=fpOf(cloud);
      if(cs===local) setBase(allData);                                // 同じ
      else if(!hasLocal || local==='[]') takeCloud(cloud,'☁️ クラウドから読み込みました');
      else{
        const cloudChanged = base===null || cs!==base;
        const localChanged = base===null || local!==base;
        if(cloudChanged && !localChanged) takeCloud(cloud,'☁️ 新しい記録を読み込みました');
        else if(!cloudChanged && localChanged) await pushCloud(true);
        else if(confirm('⚠️ この画面とクラウド（ほかの端末）の両方に、違う内容があります。\n\n'
                      + 'OK＝クラウドの内容を読み込む（この画面の内容は履歴に残ります）\n'
                      + 'キャンセル＝この画面の内容でクラウドを上書きする')) takeCloud(cloud,'☁️ クラウドの内容を読み込みました');
        else await pushCloud(true);
      }
    }
  }catch(e){ /* オフライン等。手元には保存済み */ }
  syncing=false; cloudReady=true;
}
async function pushCloud(silent){
  if(!silent) toast('☁️ アップロード中...');
  try{
    // 空の欄（'' / null / false）は送らない。クラウドの保存容量に上限があり、
    // 空欄込みだと上限を超えて保存に失敗したことがある（2026-09-08）。表示は空欄のまま変わらない
    const sent=JSON.stringify(allData,(k,v)=>(v===''||v===null||v===false)?undefined:v);
    const res=await fetch(SYNC_URL+'?action=save&key='+SYNC_KEY,{method:'POST',body:sent});
    const j=await res.json();
    if(j.success){ setBase(JSON.parse(sent)); if(!silent) toast('☁️ クラウドに保存しました'); return true; }
    if(!silent) toast('エラー: '+(j.message||''));
  }catch(e){ if(!silent) toast('通信エラー: '+e.message); }
  return false;
}
function applyCloud(j){
  if(!j||!j.success||!j.data) return false;
  let d=j.data; if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){ return false; } }
  if(!d||typeof d!=='object'||!Object.keys(d).length) return false;
  snapshot();
  allData=d; localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); setBase(allData); render();
  return true;
}
// 画面に戻ってきたときにも同期（スマホで別アプリから戻ったとき等）
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(autoCloudTimer) syncNow(); return; }   // 送る前の入力があれば送っておく
  if(cloudReady && !autoCloudTimer && Date.now()-lastSync>30*1000) syncNow();
});
async function cloudUpload(){ await pushCloud(false); }
async function cloudDownload(){
  toast('☁️ ダウンロード中...');
  try{
    const res=await fetch(SYNC_URL+'?action=load&key='+SYNC_KEY);
    const j=await res.json();
    let d=j&&j.data; if(typeof d==='string'){ try{ d=JSON.parse(d); }catch(e){} }
    if(!d||!Object.keys(d).length){ toast('クラウドにデータがありません'); return; }
    if(!confirm('クラウドのデータを読み込みますか？\n今の出納帳データは上書きされます。')) return;
    if(applyCloud(j)) toast('☁️ クラウドから読み込みました');
  }catch(e){ toast('エラー: '+(e&&e.message?e.message:e)); }
}

// ============================================================
// 描画
// ============================================================
function render(){
  document.getElementById('monthLbl').textContent = `令和${curYear}年 ${curMonth}月`;
  const p = page();
  const oi = document.getElementById('openingInp');
  if(document.activeElement !== oi) oi.value = fmt(toNum(p.opening));

  let bal = toNum(p.opening);
  let sumIn=0, sumOut=0, html='';
  p.rows.forEach((r,i)=>{
    const nyu=toNum(r.nyu), shu=toNum(r.shu);
    bal += nyu - shu; sumIn+=nyu; sumOut+=shu;
    const teikyu = (r.kamoku==='定休日') ? ' teikyu' : '';
    html += `<tr class="row${teikyu}" data-i="${i}">
      <td class="col-y"><input value="${r.y??curYear}" oninput="upd(${i},'y',this.value)"></td>
      <td class="col-m"><input value="${r.m??curMonth}" oninput="upd(${i},'m',this.value)"></td>
      <td class="col-d"><input value="${r.d??''}" inputmode="numeric" oninput="upd(${i},'d',this.value)"></td>
      <td class="col-kamoku"><input list="kamokuList" value="${esc(r.kamoku)}" oninput="upd(${i},'kamoku',this.value)"></td>
      <td class="tekiyo"><input value="${esc(r.tekiyo)}" oninput="upd(${i},'tekiyo',this.value)"></td>
      <td class="col-tax"><select onchange="upd(${i},'tax',this.value)">
        <option value=""${r.tax===''?' selected':''}></option>
        <option value="10"${String(r.tax)==='10'?' selected':''}>10</option>
        <option value="8"${String(r.tax)==='8'?' selected':''}>8</option>
      </select></td>
      <td class="col-inv"><input type="checkbox" class="invchk" ${r.invoice?'checked':''} onchange="upd(${i},'invoice',this.checked)"></td>
      <td class="num in col-in"><input value="${r.nyu!==''&&r.nyu!=null?fmt(nyu):''}" inputmode="numeric" oninput="updNum(${i},'nyu',this.value)" onblur="reformat(this)"></td>
      <td class="num out col-out"><input value="${r.shu!==''&&r.shu!=null?fmt(shu):''}" inputmode="numeric" oninput="updNum(${i},'shu',this.value)" onblur="reformat(this)"></td>
      <td class="bal col-bal">${fmt(bal)}</td>
      <td class="col-del"><button class="delbtn" onclick="delRow(${i})" title="削除">✕</button></td>
    </tr>`;
  });
  document.getElementById('tbody').innerHTML = html;
  document.getElementById('sumIn').textContent = fmt(sumIn);
  document.getElementById('sumOut').textContent = fmt(sumOut);
  document.getElementById('endBal').textContent = fmt(bal);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ============================================================
// 編集
// ============================================================
function upd(i,k,v){
  const r = page().rows[i]; if(!r) return;
  r[k] = v;
  persist();
  if(k==='nyu'||k==='shu'||k==='kamoku') render();   // 残高・定休日色を更新
}
function updNum(i,k,v){
  const r = page().rows[i]; if(!r) return;
  r[k] = toNum(v);
  // 残高・合計だけ即時更新（入力欄は再描画しないでカーソル維持）
  liveRecalc();
  persist();
}
function liveRecalc(){
  const p = page(); let bal=toNum(p.opening), sumIn=0, sumOut=0;
  const rows = document.querySelectorAll('#tbody tr');
  p.rows.forEach((r,i)=>{
    const nyu=toNum(r.nyu), shu=toNum(r.shu);
    bal += nyu - shu; sumIn+=nyu; sumOut+=shu;
    const tr = rows[i]; if(tr){ const bc=tr.querySelector('.bal'); if(bc) bc.textContent=fmt(bal); }
  });
  document.getElementById('sumIn').textContent=fmt(sumIn);
  document.getElementById('sumOut').textContent=fmt(sumOut);
  document.getElementById('endBal').textContent=fmt(bal);
}
function onOpening(el){ page().opening = toNum(el.value); liveRecalc(); persist(); }
function reformat(el){ const n=toNum(el.value); el.value = (el.value.trim()==='')?'':fmt(n); }

function addRow(){
  const p = page();
  const last = p.rows[p.rows.length-1];
  const nr = blankRow();
  if(last){ nr.y=last.y; nr.m=last.m; }   // 年月は引き継ぎ
  p.rows.push(nr); persist(); render();
  // 末尾の日付欄にフォーカス
  const rows = document.querySelectorAll('#tbody tr');
  const lastRow = rows[rows.length-1];
  if(lastRow){ const di=lastRow.querySelector('.col-d input'); if(di) di.focus(); }
}
function delRow(i){
  const p = page();
  if(p.rows.length<=1){ p.rows[0]=blankRow(); } else { p.rows.splice(i,1); }
  persist(); render();
}
function changeMonth(dir){
  curMonth += dir;
  if(curMonth>12){ curMonth=1; curYear++; }
  if(curMonth<1){ curMonth=12; curYear--; }
  render();
}

// ============================================================
// 入出力
// ============================================================
function exportData(){
  const blob=new Blob([JSON.stringify(allData,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`現金出納帳_${pageKey()}.json`; a.click(); toast('⬇ 書き出しました');
}
// 税理士提出用：Excel(CSV)で全月まとめて書き出し
function exportCSV(){
  const keys=Object.keys(allData).filter(k=>/^R\d+-\d+$/.test(k)).sort((a,b)=>{
    const[ay,am]=a.slice(1).split('-').map(Number),[by,bm]=b.slice(1).split('-').map(Number);
    return ay-by || am-bm;
  });
  const esc=s=>{ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  let csv='﻿年,月,日,相手勘定科目,摘要,税率,インボイス,入金,出金,残高\n';
  keys.forEach(k=>{
    const p=allData[k]; let bal=toNum(p.opening);
    const[yy,mm]=k.slice(1).split('-');
    csv+=`${yy},${mm},,前月末残高,,,,,,${bal}\n`;
    (p.rows||[]).forEach(r=>{
      const nyu=toNum(r.nyu), shu=toNum(r.shu); bal+=nyu-shu;
      csv+=[r.y??yy,r.m??mm,r.d??'',esc(r.kamoku),esc(r.tekiyo),(r.tax===''||r.tax==null?'':r.tax),(r.invoice?'✓':''),(nyu||''),(shu||''),bal].join(',')+'\n';
    });
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`現金出納帳_税理士提出_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  toast('📊 Excel(CSV)で書き出しました');
}
function importData(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{ try{ const d=JSON.parse(ev.target.result); snapshot(); allData=d; localStorage.setItem(STORAGE_KEY,JSON.stringify(allData)); render(); cloudAutoSave(); toast('⬆ 読み込みました'); }catch(err){ toast('❌ 読込エラー'); } };
  r.readAsText(f); e.target.value='';
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2000); }

// ============================================================
// 起動
// ============================================================
loadStorage();
render();
syncNow();   // 開いたらクラウドと突き合わせて、新しい方にそろえる
</script>
</body>
